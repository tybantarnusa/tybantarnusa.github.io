<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link! Like! Activity Record</title>
  <style>
    :root {
      --bg: #eef4fb;
      --card: #ffffff;
      --card-hover: #e3edfb;
      --accent: #93c5f5;
      --accent-strong: #978df0;
      --accent-deep: #6aa9e0;
      --text: #2d3748;
      --muted: #5b6b82;
      --border: #c9dcf0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 24px;
    }

    .wrap { width: 100%; max-width: 960px; }

    h1 {
      font-size: 44px;
      margin: 0 0 4px;
      letter-spacing: 0.5px;
      font-weight: 800;
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(90deg, #4f93d6, #6d4fc4);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: #4f93d6; /* fallback if gradient unsupported */
      filter: drop-shadow(0 1px 2px rgba(40,70,130,.18));
    }

    .subtitle {
      color: var(--muted);
      margin: 0 0 40px;
      font-size: 14px;
    }

    /* Compact header + less scroll on small screens (phones) */
    @media (max-width: 600px) {
      body { padding: 2px 0; }
      .wrap { max-width: none; }
      h1 { font-size: 48px; padding-left: 14px; }
      .subtitle { margin: 0 0 20px; font-size: 13px; padding-left: 14px; }
      /* episode view: back-btn & headings all share the 14px edge (no double inset) */
      #episode-view { padding-left: 14px; padding-right: 14px; }
      .back-btn { margin-bottom: 14px; margin-left: 0; margin-right: 0; }
      /* player view back-btn needs 14px so it lines up with player-top/meta (player-view has no padding) */
      #player-view .back-btn { margin-left: 14px; margin-right: 14px; }
      .view h2 { font-size: 19px; margin: 0 0 2px; padding-left: 0; }
      .view .hint { margin: 0 0 16px; padding-left: 0; }
    }

    /* Period menu: stacked full-width buttons */
    .menu { display: grid; grid-template-columns: 1fr; gap: 16px; width: 100%; }

    .menu-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 5px solid var(--accent);
      border-radius: 12px;
      padding: 22px 24px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer;
      transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
      user-select: none;
    }
    .menu-item:hover {
      background: linear-gradient(90deg, var(--accent), var(--accent-strong));
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(147,197,245,.35);
    }
    .menu-item:hover .num,
    .menu-item:hover .label { color: #fff; }
    .menu-item .num { font-size: 28px; font-weight: 700; color: var(--accent-deep); }
    .menu-item .num.num-text { font-size: 19px; line-height: 1.15; }
    .menu-item .label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

    /* Views */
    .view { display: none; width: 100%; }
    .view.active { display: block; }
    .menu.active { display: none; }
    /* Player view must span full width of .wrap (no inset from .wrap > * rule) */
    #player-view { padding-left: 0; padding-right: 0; }

    .back-btn {
      background: linear-gradient(90deg, var(--accent), var(--accent-strong));
      border: 0;
      color: #fff;
      padding: 6px 14px; border-radius: 9px;
      cursor: pointer; font-size: 12px; font-weight: 600; margin-bottom: 16px;
      transition: filter .15s ease, transform .15s ease;
    }
    .back-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }

    .view h2 { font-size: 24px; margin: 0 0 4px; color: var(--accent-deep); }
    .view .hint { color: var(--muted); font-size: 14px; margin: 0 0 24px; }

    .placeholder-box {
      background: var(--card); border: 1px dashed var(--accent);
      border-radius: 14px; padding: 48px 24px; text-align: center;
      color: var(--muted); font-size: 15px;
    }

    /* Episode row: large cards side by side, scroll sideways when narrow */
    .episode-row {
      display: flex; flex-wrap: nowrap; gap: 16px;
      width: 100%;
      overflow-x: auto; padding-bottom: 12px;
      scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
      touch-action: pan-x;   /* let horizontal swipe scroll the row on phones */
    }
    .episode-row::-webkit-scrollbar { height: 8px; }
    .episode-row::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
    .episode-row::-webkit-scrollbar-track { background: var(--border); border-radius: 4px; }

    .episode-card {
      position: relative;
      flex: 0 0 auto;
      width: 260px;
      height: 390px;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      scroll-snap-align: start;
      border: 1px solid var(--border);
      transition: transform .15s ease, box-shadow .15s ease;
      user-select: none;
      background-color: #2a3a55;
    }
    .episode-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 22px rgba(74,134,212,.35);
    }
    .episode-card .thumb {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center 38%;
      transform: scale(1.5);        /* stronger zoom to fully fill card, cut dark bars */
      transform-origin: center 38%;
    }
    .episode-card.thumb-fallback {
      background-color: #4a86d4;
      background-image: linear-gradient(135deg, #4a86d4 0%, #2a5a9c 100%);
    }
    .episode-card .overlay {
      position: absolute; left: 0; right: 0; bottom: 0; top: 56%;
      padding: 16px 16px 18px;
      background: linear-gradient(to top, rgba(0,0,0,.9) 0%, rgba(0,0,0,.6) 55%, rgba(0,0,0,0) 100%);
      color: #fff;
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .episode-card .ec-ep {
      font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #bcd4f2;
      text-shadow: 0 1px 3px rgba(0,0,0,.6);
    }
    .episode-card .ec-name {
      font-size: 17px; margin-top: 7px; line-height: 1.35; font-weight: 600;
      text-shadow: 0 1px 4px rgba(0,0,0,.7);
    }
    /* Fes×LIVE cards: red outline to stand out from episodes */
    .episode-card.fes { border: 2px solid #e8546b; box-shadow: 0 0 0 1px rgba(232,84,107,.35); }
    .episode-card.fes .ec-ep { color: #ff9bac; }

    /* Player view */
    .player-top {
      position: relative;
      display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
    }
    .player-top .nav-btn#prev-btn { margin-right: auto; }
    .player-top .nav-btn#next-btn { margin-left: auto; }
    .player-top .counter {
      position: absolute; left: 50%; transform: translateX(-50%);
      text-align: center; color: var(--muted); font-size: 14px; white-space: nowrap;
    }
    .nav-btn {
      background: linear-gradient(90deg, var(--accent), var(--accent-strong));
      border: 0;
      color: #fff; padding: 9px 18px; border-radius: 10px;
      cursor: pointer; font-size: 14px; font-weight: 600;
      transition: filter .15s ease, transform .15s ease;
    }
    .nav-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .nav-btn:disabled { opacity: .4; cursor: default; filter: none; transform: none; }

    .player {
      position: relative; width: 100%; aspect-ratio: 16/9;
      background: #000; border-radius: 14px; overflow: hidden;
    }
    .player.fes { border: 3px solid #e8546b; box-shadow: 0 0 18px rgba(232,84,107,.45); }
    .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    /* Drive embeds: pure 16:9 so Google's own controls stay proportional (no min-height stretch) */
    .player.drive { aspect-ratio: 16/9; background: #1a2230; }
    @media (max-width: 600px) {
      .player.drive { min-height: 0; }
    }
    .player.drive.fes { border: 3px solid #e8546b; }
    .player.archive { background: #0b0b0b; }
    @media (max-width: 600px) {
      .player.drive { min-height: 300px; }
      .wrap { padding: 32px 0; }
      .wrap > *:not(.menu) { padding-left: 14px; padding-right: 14px; }  /* keep text off the edge */
      /* but the player itself must touch the screen edges */
      #player-view { padding-left: 0; padding-right: 0; }
      .player, .player.drive, .player.fes, .player.drive.fes { border-radius: 0; }   /* video flush to screen edges */
      .player-top, .player-meta, .back-btn { padding-left: 14px; padding-right: 14px; }  /* text stays off the very edge */
      h1 { font-size: 18px; padding-left: 14px; }
      .subtitle { padding-left: 14px; }
      .menu-item { margin-left: 14px; margin-right: 14px; }
    }

    .player-meta { margin-top: 14px; }
    .player-meta .pm-ep { font-size: 16px; font-weight: 700; color: var(--accent-deep); letter-spacing: 1px; }
    .player-meta .pm-name { font-size: 20px; margin-top: 6px; line-height: 1.35; font-weight: 600; }
    .summary-box {
      margin-top: 10px; font-size: 14px; line-height: 1.55; color: var(--text);
    }
    .summary-box:empty { display: none; }
  </style>
</head>

      <div class="player-top">
        <button class="nav-btn" id="prev-btn" onclick="navEpisode(-1)">&#8592; Prev</button>
        <button class="nav-btn" id="next-btn" onclick="navEpisode(1)">Next &#8594;</button>
        <span class="counter" id="player-counter"></span>
      </div>
      <div id="player-slot"></div>
      <div class="player-meta">
        <div class="pm-ep" id="pm-ep"></div>

      <div class="summary-box" id="pm-summary"></div>

    let currentPeriod = null;

    // Load episode summaries once (hosted locally — see summaries.json)
    fetch('summaries.json').then(r => r.ok ? r.json() : {}).then(d => { summariesData = d || {}; }).catch(() => { summariesData = {}; });

    function bukaPlaylist(kode) {
      currentPeriod = kode;
      currentVideos = playlists[kode] || [];
      document.getElementById('menu').classList.add('active');
      document.getElementById('episode-view').classList.add('active');
      document.getElementById('episode-title').textContent =
        (kode === 'dream') ? 'Dream Interlude' : 'Term ' + kode;
      if (('#' + kode) !== location.hash) location.hash = kode;

      const content = document.getElementById('episode-content');
      const hint = document.getElementById('episode-hint');

      if (currentVideos.length === 0) {
        hint.textContent = 'The video list will be added here later.';
        content.innerHTML = '<div class="placeholder-box">No videos for this term yet.</div>';
        return;
      }

      hint.textContent = (currentVideos.filter(v => v.type !== 'fes').length) + ' episode' + (currentVideos.filter(v => v.type !== 'fes').length > 1 ? 's' : '');
      content.innerHTML = '<div class="episode-row"></div>';
      const row = content.querySelector('.episode-row');
      currentVideos.forEach((v, i) => {
        const isFes = (v.type === 'fes');
        let epNo, name;
        if (isFes) {
          epNo = null;
          name = v.title;
        } else {
          const m = v.title.match(/(?:Episode|Chapter)\s*(\d+)/i);
          epNo = m ? m[1] : (i + 1);
          name = v.title
            .replace(/^\d+(?:st|nd|rd|th)\s+(?:Term|Year)\s+/i, '')
            .replace(/(?:Episode|Chapter)\s*\d+\s*/i, '')
            .replace(/\s*\[ENG SUB\]$/i, '')
            .trim();
        }

        // Thumbnail arc (HamP story art)
        let arc = null;
        if (kode === 'dream') {
          arc = (i === 0) ? '200001' : '200002';
        } else if (kode === '103' || kode === '104' || kode === '105') {
          if (kode === '104' && epNo === '13') {
            arc = '105012'; // 104 ep13 is the shared finale arc
          } else {
            arc = kode + '0' + String(epNo).padStart(2, '0');
          }
        }
        const ytThumb = 'https://i.ytimg.com/vi/' + v.id + '/hqdefault.jpg';
        const localThumb = arc ? 'thumbs/' + arc + '.webp' : null;
        const remoteThumb = arc ? 'https://storage.googleapis.com/llll-card/story/monthly/image_record_monthly_' + arc + '.webp' : null;
        // local copy first, then HamP remote, then YouTube — so it still works if HamP vanishes
        const arcThumb = localThumb
          ? localThumb + '" onerror="this.onerror=null;this.src=\'' + remoteThumb + '\';this.onerror=function(){this.onerror=null;this.src=\'' + ytThumb + '\'};"'
          : null;

        const card = document.createElement('div');
        card.className = 'episode-card' + (isFes ? ' fes' : '');
        if (v.src === 'drive' || v.src === 'archive') {
          if (arcThumb) {
            // Drive has no public thumbnail, but we can borrow the HamP story-arc art
            card.innerHTML =
              '<img class="thumb" loading="lazy" src="' + arcThumb + '" alt="">' +
              '<div class="overlay"><div class="ec-ep">' + (isFes ? 'FES×LIVE' : 'EPISODE ' + epNo) + '</div>' +
              (isFes ? '' : '<div class="ec-name">' + name + '</div>') + '</div>';
          } else {
            // No arc art available: styled fallback
            card.classList.add('thumb-fallback');
            card.innerHTML =
              '<div class="overlay"><div class="ec-ep">' + (isFes ? 'FES×LIVE' : 'EPISODE ' + epNo) + '</div>' +
              (isFes ? '' : '<div class="ec-name">' + name + '</div>') + '</div>';
          }
        } else if (arcThumb) {
          // try HamP art; if it fails to load, fall back to YouTube thumb
          card.innerHTML =
            '<img class="thumb" loading="lazy" src="' + arcThumb + '" alt="" onerror="this.onerror=null;this.src=\'' + ytThumb + '\'">' +
            '<div class="overlay"><div class="ec-ep">' + (isFes ? 'FES×LIVE' : 'EPISODE ' + epNo) + '</div>' +
            (isFes ? '' : '<div class="ec-name">' + name + '</div>') + '</div>';
        } else {
          card.innerHTML =
            '<img class="thumb" loading="lazy" src="' + ytThumb + '" alt="">' +
            '<div class="overlay"><div class="ec-ep">' + (isFes ? 'FES×LIVE' : 'EPISODE ' + epNo) + '</div>' +
            (isFes ? '' : '<div class="ec-name">' + name + '</div>') + '</div>';
        }
        card.addEventListener('click', () => bukaEpisode(i));
        row.appendChild(card);
      });
    }

    function bukaEpisode(index) {
      currentIndex = index;
      document.getElementById('episode-view').classList.remove('active');
      document.getElementById('player-view').classList.add('active');
      renderPlayer();
      location.hash = currentPeriod + '/' + index;
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function renderPlayer() {
      const v = currentVideos[currentIndex];
      const isFes = (v.type === 'fes');
      let epNo, name;
      if (isFes) {
        epNo = null;
        name = v.title;
      } else {
        const m = v.title.match(/(?:Episode|Chapter)\s*(\d+)/i);
        epNo = m ? m[1] : (currentIndex + 1);
        name = v.title
          .replace(/^\d+(?:st|nd|rd|th)\s+(?:Term|Year)\s+/i, '')
          .replace(/(?:Episode|Chapter)\s*\d+\s*/i, '')
          .replace(/\s*\[ENG SUB\]$/i, '')
          .trim();
      }

      let embedSrc, embedAttrs, playerKind;
      if (v.src === 'drive') {
        embedSrc = 'https://drive.google.com/file/d/' + v.id + '/preview';
        embedAttrs = 'allow="autoplay; fullscreen" allowfullscreen';
        playerKind = 'drive';
      } else if (v.src === 'archive') {
        embedSrc = 'https://archive.org/embed/' + v.id;
        embedAttrs = 'allow="autoplay; fullscreen" allowfullscreen webkitallowfullscreen';
        playerKind = 'archive';
      } else {
        embedSrc = 'https://www.youtube.com/embed/' + v.id + '?autoplay=1';
        embedAttrs = 'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen';
        playerKind = '';
      }

      const playerClass = 'player ' + playerKind + (isFes ? ' fes' : '');
      document.getElementById('player-slot').innerHTML =
        '<div class="' + playerClass + '"><iframe src="' + embedSrc +
        '" ' + embedAttrs + '></iframe></div>';
      document.getElementById('pm-ep').textContent = isFes ? 'FES×LIVE' : 'EPISODE ' + epNo;
      document.getElementById('pm-name').textContent = name;
      // Episode summary (hosted locally; hidden for Fes×LIVE which has no entry)
      const sumEl = document.getElementById('pm-summary');
      const sumText = (!isFes && epNo != null) ? summariesData[currentPeriod + '-' + epNo] : null;
      sumEl.innerHTML = sumText ? sumText : '';
      // Fes×LIVE does not count as an episode in the progress counter
      const epCount = currentVideos.filter(v => v.type !== 'fes').length;
      const epPos = currentVideos.slice(0, currentIndex + 1).filter(v => v.type !== 'fes').length;
      document.getElementById('player-counter').textContent = isFes ? '' : (epPos + ' / ' + epCount);

      document.getElementById('prev-btn').disabled = (currentIndex === 0);
      document.getElementById('next-btn').disabled = (currentIndex === currentVideos.length - 1);
    }

    function navEpisode(step) {
      const ni = currentIndex + step;
      if (ni < 0 || ni >= currentVideos.length) return;
      currentIndex = ni;
      renderPlayer();
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function kembaliKeEpisode() {
      document.getElementById('player-slot').innerHTML = ''; // stop audio: remove the iframe
      document.getElementById('player-view').classList.remove('active');
      document.getElementById('episode-view').classList.add('active');
      location.hash = currentPeriod;
    }

    function kembaliKeMenu() {
      document.getElementById('player-slot').innerHTML = ''; // stop audio if leaving from player
      document.getElementById('episode-view').classList.remove('active');
      document.getElementById('player-view').classList.remove('active');
      document.getElementById('menu').classList.remove('active');
      history.replaceState(null, '', location.pathname + location.search);
    }

    // Keyboard navigation inside player view
    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('player-view').classList.contains('active')) return;
      if (e.key === 'ArrowLeft') navEpisode(-1);
      if (e.key === 'ArrowRight') navEpisode(1);
    });

    // Restore view from URL hash on load (so refresh stays on the same page/episode)
    (function restoreFromHash() {
      const h = location.hash.replace(/^#/, '');
      if (!h) return;
      const parts = h.split('/');
      const kode = parts[0];
      if (!playlists[kode]) return;
      bukaPlaylist(kode);
      if (parts[1] !== undefined) {
        const idx = parseInt(parts[1], 10);
        if (!isNaN(idx) && idx >= 0 && idx < currentVideos.length) {
          // open the player directly
          currentIndex = idx;
          document.getElementById('episode-view').classList.remove('active');
          document.getElementById('player-view').classList.add('active');
          renderPlayer();
          window.scrollTo({ top: 0, behavior: 'auto' });
        }
      }
    })();
  </script>
</body>
</html>
