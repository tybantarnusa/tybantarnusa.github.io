<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link! Like! Activity Record</title>
  <style>
    :root {
      --bg: #eef4fb;
      --card: #ffffff;
      --card-hover: #e3edfb;
      --accent: #93c5f5;
      --accent-strong: #978df0;
      --accent-deep: #4f93d6;
      --text: #2d3748;
      --muted: #5b6b82;
      --border: #c9dcf0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
    }

    .wrap { width: 100%; max-width: 960px; }

    h1 {
      font-size: 22px;
      margin: 0 0 4px;
      letter-spacing: 0.5px;
      color: var(--accent-deep);
    }

    .subtitle {
      color: var(--muted);
      margin: 0 0 40px;
      font-size: 14px;
    }

    /* Compact header + less scroll on small screens (phones) */
    @media (max-width: 600px) {
      body { padding: 20px 14px; }
      h1 { font-size: 18px; }
      .subtitle { margin: 0 0 20px; font-size: 13px; }
      .back-btn { margin-bottom: 14px; }
      .view h2 { font-size: 19px; margin: 0 0 2px; }
      .view .hint { margin: 0 0 16px; }
    }

    /* Period menu: stacked full-width buttons */
    .menu { display: grid; grid-template-columns: 1fr; gap: 16px; width: 100%; }

    .menu-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 5px solid var(--accent);
      border-radius: 12px;
      padding: 22px 24px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer;
      transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
      user-select: none;
    }
    .menu-item:hover {
      background: linear-gradient(90deg, var(--accent), var(--accent-strong));
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(147,197,245,.35);
    }
    .menu-item:hover .num,
    .menu-item:hover .label { color: #fff; }
    .menu-item .num { font-size: 28px; font-weight: 700; color: var(--accent-deep); }
    .menu-item .num.num-text { font-size: 19px; line-height: 1.15; }
    .menu-item .label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

    /* Views */
    .view { display: none; width: 100%; }
    .view.active { display: block; }
    .menu.active { display: none; }

    .back-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--accent-strong);
      padding: 8px 16px; border-radius: 10px;
      cursor: pointer; font-size: 14px; margin-bottom: 24px;
    }
    .back-btn:hover { background: var(--card-hover); }

    .view h2 { font-size: 24px; margin: 0 0 4px; color: var(--accent-deep); }
    .view .hint { color: var(--muted); font-size: 14px; margin: 0 0 24px; }

    .placeholder-box {
      background: var(--card); border: 1px dashed var(--accent);
      border-radius: 14px; padding: 48px 24px; text-align: center;
      color: var(--muted); font-size: 15px;
    }

    /* Episode row: large cards side by side, scroll sideways when narrow */
    .episode-row {
      display: flex; flex-wrap: nowrap; gap: 16px;
      overflow-x: auto; padding-bottom: 12px;
      scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
    }
    .episode-row::-webkit-scrollbar { height: 8px; }
    .episode-row::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
    .episode-row::-webkit-scrollbar-track { background: var(--border); border-radius: 4px; }

    .episode-card {
      position: relative;
      flex: 0 0 auto;
      width: 260px;
      height: 390px;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      scroll-snap-align: start;
      border: 1px solid var(--border);
      transition: transform .15s ease, box-shadow .15s ease;
      user-select: none;
      background-color: #2a3a55;
    }
    .episode-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 22px rgba(74,134,212,.35);
    }
    .episode-card .thumb {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center 38%;
      transform: scale(1.5);        /* stronger zoom to fully fill card, cut dark bars */
      transform-origin: center 38%;
    }
    .episode-card.thumb-fallback {
      background-color: #4a86d4;
      background-image: linear-gradient(135deg, #4a86d4 0%, #2a5a9c 100%);
    }
    .episode-card .overlay {
      position: absolute; left: 0; right: 0; bottom: 0; top: 68%;
      padding: 14px 16px 16px;
      background: linear-gradient(to top, rgba(0,0,0,.85) 0%, rgba(0,0,0,.55) 55%, rgba(0,0,0,0) 100%);
      color: #fff;
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .episode-card .ec-ep {
      font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #bcd4f2;
    }
    .episode-card .ec-name {
      font-size: 14px; margin-top: 6px; line-height: 1.3; font-weight: 600;
    }

    /* Player view */
    .player-top {
      display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
    }
    .nav-btn {
      background: var(--card); border: 1px solid var(--border);
      color: var(--accent-deep); padding: 9px 14px; border-radius: 10px;
      cursor: pointer; font-size: 14px; font-weight: 600;
      transition: background .15s ease;
    }
    .nav-btn:hover { background: var(--card-hover); }
    .nav-btn:disabled { opacity: .4; cursor: default; }
    .player-top .counter { color: var(--muted); font-size: 14px; margin-left: auto; }

    .player {
      position: relative; width: 100%; aspect-ratio: 16/9;
      background: #000; border-radius: 14px; overflow: hidden;
    }
    .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    /* Drive embeds misbehave on mobile; give them a solid box + min height */
    .player.drive { aspect-ratio: 16/9; min-height: 220px; background: #1a2230; }
    @media (max-width: 600px) {
      .player.drive { min-height: 200px; }
    }

    .player-meta { margin-top: 14px; }
    .player-meta .pm-ep { font-size: 14px; font-weight: 700; color: var(--accent-deep); letter-spacing: 1px; }
    .player-meta .pm-name { font-size: 16px; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Link! Like! Activity Record</h1>

    <!-- Period menu -->
    <div class="menu" id="menu">
      <p class="subtitle">Select a term</p>
      <div class="menu-item" onclick="bukaPlaylist('102')"><div class="num">102</div><div class="label">Term</div></div>
      <div class="menu-item" onclick="bukaPlaylist('103')"><div class="num">103</div><div class="label">Term</div></div>
      <div class="menu-item" onclick="bukaPlaylist('104')"><div class="num">104</div><div class="label">Term</div></div>
      <div class="menu-item" onclick="bukaPlaylist('105')"><div class="num">105</div><div class="label">Term</div></div>
      <div class="menu-item" onclick="bukaPlaylist('dream')"><div class="num num-text">Dream Interlude</div><div class="label">2 videos</div></div>
    </div>

    <!-- Episode list (sideways) -->
    <div class="view" id="episode-view">
      <button class="back-btn" onclick="kembaliKeMenu()">&larr; Back</button>
      <h2 id="episode-title">Term</h2>
      <p class="hint" id="episode-hint"></p>
      <div id="episode-content"></div>
    </div>

    <!-- Player view -->
    <div class="view" id="player-view">
      <button class="back-btn" onclick="kembaliKeEpisode()">&larr; Back to episodes</button>
      <div class="player-top">
        <button class="nav-btn" id="prev-btn" onclick="navEpisode(-1)">&#8592; Prev</button>
        <button class="nav-btn" id="next-btn" onclick="navEpisode(1)">Next &#8594;</button>
        <span class="counter" id="player-counter"></span>
      </div>
      <div id="player-slot"></div>
      <div class="player-meta">
        <div class="pm-ep" id="pm-ep"></div>
        <div class="pm-name" id="pm-name"></div>
      </div>
    </div>
  </div>

  <script>
    const playlists = {
      "102": [
        { "id": "ev2UfMBeGbY", "title": "102nd Term Shades of Stars Chapter 1 \"A Falling Star\"" },
        { "id": "HI1ro9aAdos", "title": "102nd Term Shades of Stars Chapter 2 \"Sparkly Spot\"" },
        { "id": "C69Oj0oNR-g", "title": "102nd Term Shades of Stars Chapter 3 \"Reflection in the mirror P1\"" },
        { "id": "U1eMOG_Iq6c", "title": "102nd Term Shades of Stars Chapter 4 \"Reflection in the mirror P2\"" },
        { "id": "W2ZYy1IDeeg", "title": "102nd Term Shades of Stars Chapter 5 \"Love with the world\"" },
        { "id": "uBQBXu_0Cb8", "title": "102nd Year Shades of Stars Chapter 6 \"On your mark Part 1\"" },
        { "id": "svnqDimMTZU", "title": "102nd Year Shades of Stars Chapter 7 \"On your mark Part 2\"" },
        { "id": "WQzn4EuEy4k", "title": "102nd Year Shades of Stars Epilogue" }
      ],
      "103": [
        { "id": "7jAK9XZnUW0", "title": "103rd Term Episode 1 \"I Want to Bloom!\"" },
        { "id": "zyfMgI6nLgw", "title": "103rd Term Episode 2 \"No Good⇒World’s Best!?\"" },
        { "id": "JZ_haZN6-GI", "title": "103rd Term Episode 3 \"Rain, Wind, and Sun\"" },
        { "id": "zeBVo4StRiE", "title": "103rd Term Episode 4 \"My School Idol\"" },
        { "id": "_7DlIHOD2lY", "title": "103rd Term Episode 5 \"Head up\"" },
        { "id": "935krFf2bBk", "title": "103rd Term Episode 6 \"Selfish on the ICE!!\"" },
        { "id": "s8OpSRvG4fM", "title": "103rd Term Episode 7 \"Senpai and Kouhai\"" },
        { "id": "_NbU1zXeOuI", "title": "103rd Term Episode 8 \"The Heart of That Day, the Heart of Tomorrow\"" },
        { "id": "9Lzn7aDqUf0", "title": "103rd Term Episode 9 \"The Ruri Escape\"" },
        { "id": "_wjxCkfAsTU", "title": "103rd Term Episode 10 \"Ruri-Megu with Fanfare\"" },
        { "id": "97CsqCXuDBw", "title": "103rd Term Episode 11 \"For the School Idol Club! (?)\"" },
        { "id": "Ep8KJ22oZRo", "title": "103rd Term Episode 12 \"Heavy Expectations!\"" },
        { "id": "qOqAsgtSFsU", "title": "103rd Term Episode 13 \"Caught Up\"" },
        { "id": "1AJp2IAIe-E", "title": "103rd Term Episode 14 \"Link! Like!\"" },
        { "id": "GO76pYV3Gxw", "title": "103rd Term Episode 15 \"Dream Believers\"" },
        { "id": "yIrJMGtFcTI", "title": "103rd Term Episode 16 \"Special Thanks\"" },
        { "id": "TbtO0cJAP68", "title": "103rd Term Episode 17 \"Ruri thinks.\"" },
        { "id": "LtTzDz1FY-w", "title": "103rd Term Episode 18 \"The Inevitable Fourth Cherry Blossom\"" }
      ],
      "104": [
        { "id": "cbD6ZGkkVMc", "title": "104th Term Episode 1 \"Song to the Future\"" },
        { "id": "O0VBpYABVZI", "title": "104th Term Episode 2 \"Watch me, I'll keep dancing\"" },
        { "id": "7eAiw613yW8", "title": "104th Term Episode 3 \"Ergo Mira-Cra Park!\"" },
        { "id": "iLoBZ9nWn0A", "title": "104th Term Episode 4 \"Beneath the same sky, Then and Now\"" },
        { "id": "Z_VgNraowyg", "title": "104th Term Episode 5 \"Imperfect and Incomplete\"" },
        { "id": "K9KV85nQdSg", "title": "104th Term Episode 6 \"GLHF!!!\"" },
        { "id": "XHwlQBfVyHE", "title": "104th Term Episode 7 \"Link to the FRIENDS!\"" },
        { "id": "b2e8jT_jQVA", "title": "104th Term Episode 8 \"Not a marionette\"" },
        { "id": "m_2Ycv8S2go", "title": "104th Term Episode 9 \"Miracle the universe!\"" },
        { "id": "5_j8CzSG6EU", "title": "104th Term Episode 10 \"Believe your love. Believe your live.\"" },
        { "id": "fbwWPaLScsI", "title": "104th Term Episode 11 \"Bloom the Dream\"" },
        { "id": "Pu10BzPHP-M", "title": "104th Term Episode 12 \"A Bouquet for the You of Tomorrow\"" },
        { "id": "1G0HHa39-OmHP6YWfMku0Nb13mPFAAVuo", "src": "drive", "title": "104th Term Episode 13 \"The Eventual Promised Cherry Blossoms\"" }
      ],
      "105": [
        { "id": "-sZHOIWGQGk", "title": "105th Term Episode 1 \"Brand New Stories!!\"" },
        { "id": "BlZ5XSeOoMU", "title": "105th Term Episode 2 \"Dream Match!\"" },
        { "id": "ZVzdlyl1gU0", "title": "105th Term Episode 3 \"Flowers dance, yearning for the stars\"" },
        { "id": "0OgN0slD_zU", "title": "105th Term Episode 4 \"Chasing My Sunshine\"" },
        { "id": "GIWQvpR42sM", "title": "105th Term Episode 5 \"Sleeping Beauty of the Sea!\"" },
        { "id": "0LwxZN_s9XY", "title": "105th Term Episode 6 \"Flowers for the Future\"" },
        { "id": "FLIWLq5o730", "title": "105th Term Episode 7 \"Proof of my selfish color\"" },
        { "id": "5QwgpqHTYLc", "title": "105th Term Episode 8 \"A light still distant and faint\"" },
        { "id": "-wV7EAf_MX4", "title": "105th Term Episode 9 \"ALL Link to YOU\"" },
        { "id": "9VDUjJIxfso", "title": "105th Term Episode 10 \"Ergo Ruri.\"" },
        { "id": "6NYeu9IOGdQ", "title": "105th Term Episode 11 \"I want to bloom, with everyone!\"" },
        { "id": "1whPXj2a_yy-nNjrflbiDjTJ39stSjwjd", "src": "drive", "title": "105th Term Episode 12 \"Our Everblooming Cherry Blossoms\"" }
      ],
      "dream": [
        { "id": "VzLRAYU-y2k", "title": "Dream Interlude \"Water the flowers\"" },
        { "id": "LLuRLXd41YM", "title": "Dream Interlude \"Be Cera-fish\"" }
      ]
    };

    let currentPeriod = null;
    let currentVideos = [];
    let currentIndex = 0;

    function bukaPlaylist(kode) {
      currentPeriod = kode;
      currentVideos = playlists[kode] || [];
      document.getElementById('menu').classList.add('active');
      document.getElementById('episode-view').classList.add('active');
      document.getElementById('episode-title').textContent =
        (kode === 'dream') ? 'Dream Interlude' : 'Term ' + kode;

      const content = document.getElementById('episode-content');
      const hint = document.getElementById('episode-hint');

      if (currentVideos.length === 0) {
        hint.textContent = 'The video list will be added here later.';
        content.innerHTML = '<div class="placeholder-box">No videos for this term yet.</div>';
        return;
      }

      hint.textContent = currentVideos.length + ' episode' + (currentVideos.length > 1 ? 's' : '');
      content.innerHTML = '<div class="episode-row"></div>';
      const row = content.querySelector('.episode-row');
      currentVideos.forEach((v, i) => {
        const m = v.title.match(/(?:Episode|Chapter)\s*(\d+)/i);
        const epNo = m ? m[1] : (i + 1);
        const name = v.title
          .replace(/^\d+(?:st|nd|rd|th)\s+(?:Term|Year)\s+/i, '')
          .replace(/(?:Episode|Chapter)\s*\d+\s*/i, '')
          .replace(/\s*\[ENG SUB\]$/i, '')
          .trim();

        // Thumbnail arc (HamP story art)
        let arc = null;
        if (kode === 'dream') {
          arc = (i === 0) ? '200001' : '200002';
        } else if (kode === '103' || kode === '104' || kode === '105') {
          if (kode === '104' && epNo === '13') {
            arc = '105012'; // 104 ep13 is the shared finale arc
          } else {
            arc = kode + '0' + String(epNo).padStart(2, '0');
          }
        }
        const ytThumb = 'https://i.ytimg.com/vi/' + v.id + '/hqdefault.jpg';
        const localThumb = arc ? 'thumbs/' + arc + '.webp' : null;
        const remoteThumb = arc ? 'https://storage.googleapis.com/llll-card/story/monthly/image_record_monthly_' + arc + '.webp' : null;
        // local copy first, then HamP remote, then YouTube — so it still works if HamP vanishes
        const arcThumb = localThumb
          ? localThumb + '" onerror="this.onerror=null;this.src=\'' + remoteThumb + '\';this.onerror=function(){this.onerror=null;this.src=\'' + ytThumb + '\'};"'
          : null;

        const card = document.createElement('div');
        card.className = 'episode-card';
        if (v.src === 'drive') {
          if (arcThumb) {
            // Drive has no public thumbnail, but we can borrow the HamP story-arc art
            card.innerHTML =
              '<img class="thumb" loading="lazy" src="' + arcThumb + '" alt="">' +
              '<div class="overlay"><div class="ec-ep">EPISODE ' + epNo + '</div>' +
              '<div class="ec-name">' + name + '</div></div>';
          } else {
            // No arc art available: styled fallback
            card.classList.add('thumb-fallback');
            card.innerHTML =
              '<div class="overlay"><div class="ec-ep">EPISODE ' + epNo + '</div>' +
              '<div class="ec-name">' + name + '</div></div>';
          }
        } else if (arcThumb) {
          // try HamP art; if it fails to load, fall back to YouTube thumb
          card.innerHTML =
            '<img class="thumb" loading="lazy" src="' + arcThumb + '" alt="" onerror="this.onerror=null;this.src=\'' + ytThumb + '\'">' +
            '<div class="overlay"><div class="ec-ep">EPISODE ' + epNo + '</div>' +
            '<div class="ec-name">' + name + '</div></div>';
        } else {
          card.innerHTML =
            '<img class="thumb" loading="lazy" src="' + ytThumb + '" alt="">' +
            '<div class="overlay"><div class="ec-ep">EPISODE ' + epNo + '</div>' +
            '<div class="ec-name">' + name + '</div></div>';
        }
        card.addEventListener('click', () => bukaEpisode(i));
        row.appendChild(card);
      });
    }

    function bukaEpisode(index) {
      currentIndex = index;
      document.getElementById('episode-view').classList.remove('active');
      document.getElementById('player-view').classList.add('active');
      renderPlayer();
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function renderPlayer() {
      const v = currentVideos[currentIndex];
      const m = v.title.match(/(?:Episode|Chapter)\s*(\d+)/i);
      const epNo = m ? m[1] : (currentIndex + 1);
      const name = v.title
        .replace(/^\d+(?:st|nd|rd|th)\s+(?:Term|Year)\s+/i, '')
        .replace(/(?:Episode|Chapter)\s*\d+\s*/i, '')
        .replace(/\s*\[ENG SUB\]$/i, '')
        .trim();

      let embedSrc, embedAttrs;
      if (v.src === 'drive') {
        embedSrc = 'https://drive.google.com/file/d/' + v.id + '/preview';
        embedAttrs = 'allow="autoplay"';
      } else {
        embedSrc = 'https://www.youtube.com/embed/' + v.id + '?autoplay=1';
        embedAttrs = 'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen';
      }

      const playerClass = (v.src === 'drive') ? 'player drive' : 'player';
      document.getElementById('player-slot').innerHTML =
        '<div class="' + playerClass + '"><iframe src="' + embedSrc +
        '" ' + embedAttrs + '></iframe></div>';
      document.getElementById('pm-ep').textContent = 'EPISODE ' + epNo;
      document.getElementById('pm-name').textContent = name;
      document.getElementById('player-counter').textContent = (currentIndex + 1) + ' / ' + currentVideos.length;

      document.getElementById('prev-btn').disabled = (currentIndex === 0);
      document.getElementById('next-btn').disabled = (currentIndex === currentVideos.length - 1);
    }

    function navEpisode(step) {
      const ni = currentIndex + step;
      if (ni < 0 || ni >= currentVideos.length) return;
      currentIndex = ni;
      renderPlayer();
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function kembaliKeEpisode() {
      document.getElementById('player-slot').innerHTML = ''; // stop audio: remove the iframe
      document.getElementById('player-view').classList.remove('active');
      document.getElementById('episode-view').classList.add('active');
    }

    function kembaliKeMenu() {
      document.getElementById('player-slot').innerHTML = ''; // stop audio if leaving from player
      document.getElementById('episode-view').classList.remove('active');
      document.getElementById('player-view').classList.remove('active');
      document.getElementById('menu').classList.remove('active');
    }

    // Keyboard navigation inside player view
    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('player-view').classList.contains('active')) return;
      if (e.key === 'ArrowLeft') navEpisode(-1);
      if (e.key === 'ArrowRight') navEpisode(1);
    });
  </script>
</body>
</html>
