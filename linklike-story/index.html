<html lang="en">
<head>

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />

  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #eef4fb;
      --card: #ffffff;
      --card-hover: #e3edfb;
      --accent: #93c5f5;
      --accent-strong: #978df0;
      --accent-deep: #6aa9e0;
      --text: #2d3748;
      --muted: #5b6b82;
      --border: #c9dcf0;
    }

    body.dark-mode {
      --bg: #131824;
      --card: #1e2538;
      --card-hover: #28304a;
      --accent: #4f93d6;
      --accent-strong: #7b6fde;
      --accent-deep: #5ea5e8;
      --text: #d0dbea;
      --muted: #8095b0;
      --border: #2d3750;
    }
    body.dark-mode .ads-notice { background: rgba(0,0,0,.35); }
    .dm-btn {
      background: rgba(255,255,255,.15); border: 0; color: #fff;
      font-size: 0; cursor: pointer; padding: 0; line-height: 1;
      width: 36px; height: 36px; border-radius: 50%;
      transition: background .2s, transform .2s;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .dm-btn::after {
      content: '\1F319'; font-size: 18px; line-height: 1;
    }
    body.dark-mode .dm-btn::after {
      content: '\2600\FE0F';
    }
    .dm-btn:hover { background: rgba(255,255,255,.28); transform: scale(1.1); }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 24px;
      overflow-x: hidden;   /* never let the page scroll horizontally on phones */
    }

    .wrap { width: 100%; max-width: 960px; }
    h1 {
      font-size: 30px;
      margin: 0 0 4px;
      letter-spacing: 0.5px;
      font-weight: 800;
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(90deg, #4f93d6, #6d4fc4);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: #4f93d6; /* fallback if gradient unsupported */
      filter: drop-shadow(0 1px 2px rgba(40,70,130,.18));
    }
    /* Header band: dark blue->purple gradient so the title sits on a distinct background */
    .site-header {
      background: linear-gradient(90deg, #4f93d6, #6d4fc4);
      border-radius: 14px;
      padding: 22px 24px;
      margin-bottom: 36px;
      box-shadow: 0 6px 20px rgba(79,147,214,.25);
      cursor: pointer;
      transition: filter .15s ease;
    }
    .site-header:hover { filter: brightness(1.08); }
    .site-header h1 {
      background: none; -webkit-text-fill-color: #fff; color: #fff;
      -webkit-background-clip: border-box; background-clip: border-box;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.18));
    }
    .site-header .subtitle { color: rgba(255,255,255,.85); margin: 0; }

    .subtitle {
      color: var(--accent-deep);
      margin: 0 0 14px;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: .3px;
    }

    /* Compact header + less scroll on small screens (phones) */
    @media (max-width: 600px) {
      body { padding: 0 0 24px; }
      .wrap { max-width: none; min-width: 0; overflow-x: hidden; }
      .episode-row { width: 100%; max-width: 100%; overscroll-behavior-x: contain;
        -webkit-overflow-scrolling: touch; }
      h1 { font-size: 26px; padding-left: 0; }
      .subtitle { margin: 0 0 12px; font-size: 18px; padding-left: 0; font-weight: 500; }
      /* episode view: back-btn & headings all share the 14px edge (no double inset) */
      #episode-view { padding-left: 14px; padding-right: 14px; }
      .back-btn { margin-bottom: 14px; margin-left: 0; margin-right: 0; }
      .view h2 { font-size: 19px; margin: 0 0 2px; padding-left: 0; }
      .view .hint { margin: 0 0 16px; padding-left: 0; }
      /* summary box: keep off the screen edges on phones */
      .summary-box { margin-left: 14px; margin-right: 14px; }
    }

    /* Period menu: stacked full-width buttons */
    .menu { display: grid; grid-template-columns: 1fr; gap: 16px; width: 100%; }

    .menu-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 5px solid var(--accent);
      border-radius: 12px;
      padding: 22px 24px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer;
      transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
      user-select: none;
    }
    .menu-item:hover {
      background: linear-gradient(90deg, var(--accent), var(--accent-strong));
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(147,197,245,.35);
    }
    .menu-item:hover .num,
    .menu-item:hover .label { color: #fff; }
    .menu-item .num { font-size: 28px; font-weight: 700; color: var(--accent-deep); white-space: normal; line-height: 1.1; }
    .menu-item .label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

    /* Term menu split into Main Story / Side Story sections */
    .menu-section { display: block; }
    .menu-section + .menu-section { margin-top: 12px; }
    .menu-section .section-title {
      font-size: 14px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.5px; color: var(--accent-deep);
      margin: 0 0 12px; padding-left: 2px;
    }
    .menu-grid { display: grid; grid-template-columns: 1fr; gap: 16px; width: 100%; }

    /* Continue Watching card */
    .cw-card {
      display: flex; gap: 0; background: var(--card);
      border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
      height: 72px; cursor: pointer; position: relative;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .cw-card:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79,147,214,.2); }
    .cw-thumb { width: 100px; height: 100%; flex-shrink: 0; background: #4a86d4; overflow: hidden; }
    .cw-thumb img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
    .cw-info { flex: 1; padding: 10px 14px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
    .cw-term { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-deep); }
    .cw-title { font-size: 13px; font-weight: 600; line-height: 1.2; }
    .cw-clear {
      position: absolute; top: 2px; right: 2px;
      background: none; border: 0; color: var(--muted);
      font-size: 20px; cursor: pointer; padding: 6px 10px; line-height: 1;
      border-radius: 8px; z-index: 2;
    }
    .cw-clear:hover { background: rgba(0,0,0,.06); color: var(--text); }

    /* Views */
    .view { display: none; width: 100%; }
    .view.active { display: block; }
    .menu.active { display: none; }
    /* Player view must span full width of .wrap (no inset from .wrap > * rule) */
    #player-view { padding-left: 0; padding-right: 0; }

    .back-btn {
      background: linear-gradient(90deg, var(--accent), var(--accent-strong));
      border: 0;
      color: #fff;
      padding: 6px 14px; border-radius: 9px;
      cursor: pointer; font-size: 12px; font-weight: 600; margin-bottom: 16px;
      transition: filter .15s ease, transform .15s ease;
    }
    .back-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }

    .episode-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .toggle-switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
    .toggle-switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: relative; width: 38px; height: 20px; background: var(--border); border-radius: 10px; transition: background .2s; flex-shrink: 0; }
    .toggle-slider::after { content: ''; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: left .2s; }
    .toggle-switch input:checked + .toggle-slider { background: linear-gradient(90deg, var(--accent), var(--accent-strong)); }
    .toggle-switch input:checked + .toggle-slider::after { left: 20px; }
    .toggle-label { font-size: 13px; color: var(--muted); }
    .player-fes-toggle { display: flex; justify-content: flex-end; margin-bottom: 10px; }
    .view h2 { font-size: 24px; margin: 0 0 4px; color: var(--accent-deep); }
    .view .hint { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
    .note { margin: 14px 0 4px; font-size: 13px; color: var(--accent-deep); }

    .placeholder-box {
      background: var(--card); border: 1px dashed var(--accent);
      border-radius: 14px; padding: 48px 24px; text-align: center;
      color: var(--muted); font-size: 15px;
    }

    /* Episode row: large cards side by side, scroll sideways when narrow */
    .episode-row {
      display: flex; flex-wrap: nowrap; gap: 16px;
      width: 100%;
      overflow-x: auto; padding-bottom: 12px;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;   /* let horizontal swipe scroll the row on phones */
    }
    .episode-row::-webkit-scrollbar { display: none; }  /* use custom draggable bar below (works on mobile) */
    .ep-scrollbar { position: relative; height: 9px; margin: 4px 2px 2px; background: var(--border); border-radius: 5px; }
    .ep-scrollbar-thumb { position: absolute; top: 0; left: 0; height: 100%; min-width: 28px;
      background: linear-gradient(90deg, var(--accent), var(--accent-strong)); border-radius: 5px;
      touch-action: none; }

    .episode-card {
      position: relative;
      flex: 0 0 auto;
      width: 260px;
      height: 390px;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: transform .15s ease, box-shadow .15s ease;
      user-select: none;
      background-color: #2a3a55;
    }
    .episode-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 22px rgba(74,134,212,.35);
    }
    .episode-card .thumb {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center 38%;
      transform: scale(1.5);        /* stronger zoom to fully fill card, cut dark bars */
      transform-origin: center 38%;
    }
    .episode-card.thumb-fallback {
      background-color: #4a86d4;
      background-image: linear-gradient(135deg, #4a86d4 0%, #2a5a9c 100%);
    }
    .episode-card .overlay {
      position: absolute; left: 0; right: 0; bottom: 0; top: 56%;
      padding: 16px 16px 18px;
      background: linear-gradient(to top, rgba(0,0,0,.9) 0%, rgba(0,0,0,.6) 55%, rgba(0,0,0,0) 100%);
      color: #fff;
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .episode-card .ec-ep {
      font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #bcd4f2;
      text-shadow: 0 1px 3px rgba(0,0,0,.6);
    }
    .episode-card .ec-name {
      font-size: 17px; margin-top: 7px; line-height: 1.35; font-weight: 600;
      text-shadow: 0 1px 4px rgba(0,0,0,.7);
    }
    /* Fes×LIVE cards: red outline to stand out from episodes */
    .episode-card.fes { border: 2px solid #e8546b; box-shadow: 0 0 0 1px rgba(232,84,107,.35); }
    .episode-card.fes .ec-ep { color: #ff9bac; }

    /* Player view */
    .player-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; gap: 12px;
    }
    .player-bar .back-btn { margin-bottom: 0; }
    .player-top {
      position: relative;
      display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
    }
    .player-top .nav-btn#prev-btn { margin-right: auto; }
    .player-top .nav-btn#next-btn { margin-left: auto; }
    .player-top .counter {
      position: absolute; left: 50%; transform: translateX(-50%);
      text-align: center; color: var(--muted); font-size: 14px; white-space: nowrap;
    }
    .nav-btn {
      background: linear-gradient(90deg, var(--accent), var(--accent-strong));
      border: 0;
      color: #fff; padding: 9px 18px; border-radius: 10px;
      cursor: pointer; font-size: 14px; font-weight: 600;
      transition: filter .15s ease, transform .15s ease;
    }
    .nav-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .nav-btn:disabled { opacity: .4; cursor: default; filter: none; transform: none; }

    .player {
      position: relative; width: 100%; aspect-ratio: 16/9;
      background: #000; border-radius: 14px; overflow: hidden;
    }
    .player.fes { border: 3px solid #e8546b; box-shadow: 0 0 18px rgba(232,84,107,.45); }
    .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    /* Drive embeds: pure 16:9 so Google's own controls stay proportional (no min-height stretch) */
    .player.drive { aspect-ratio: 16/9; background: #1a2230; }
    @media (max-width: 600px) {
      .player.drive { min-height: 0; }
    }
    .player.drive.fes { border: 3px solid #e8546b; }
    .player.archive { background: #0b0b0b; }
    @media (max-width: 600px) {
      .player.drive { min-height: 300px; }
      .wrap { padding: 0; }
      .wrap > *:not(.menu):not(.site-header) { padding-left: 14px; padding-right: 14px; }  /* keep text off the edge */
      /* header band pinned to the very top, edge-to-edge on phones */
      .site-header {
        position: sticky; top: 0; z-index: 20;
        margin: 0 0 16px; border-radius: 0;
        padding: 16px 16px;
      }
      /* but the player itself must touch the screen edges */
      #player-view { padding-left: 0; padding-right: 0; }
      .player, .player.drive, .player.fes, .player.drive.fes { border-radius: 0; }   /* video flush to screen edges */
      .player-bar, .player-top, .player-meta { padding-left: 14px; padding-right: 14px; }  /* text stays off the very edge */
      h1 { font-size: 18px; padding-left: 14px; }
      .subtitle { padding-left: 14px; }
      .menu-item { margin-left: 14px; margin-right: 14px; }
      .cw-card { margin-left: 14px; margin-right: 14px; }
      /* keep section titles off the left edge on phones (align with cards) */
      .menu-section .section-title { padding-left: 14px; }
    }

    .player-meta { margin-top: 14px; }
    .player-meta .pm-ep { font-size: 16px; font-weight: 700; color: var(--accent-deep); letter-spacing: 1px; }
    .player-meta .pm-name { font-size: 20px; margin-top: 6px; line-height: 1.35; font-weight: 600; }
    .summary-box {
      margin-top: 16px; padding: 14px 16px;
      background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--accent);
      border-radius: 12px; font-size: 14px; line-height: 1.55; color: var(--text);
    }
    .summary-box:empty { display: none; }
    .summary-box .sum-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 6px; }
    .ads-notice {
      margin: 10px 0 0; padding: 8px 34px 8px 12px;
      background: rgba(255,255,255,.55); border-radius: 8px;
      font-size: 12px; color: var(--muted); text-align: center; line-height: 1.4;
      position: relative;
    }
    .ads-notice .an-close {
      position: absolute; top: 2px; right: 4px;
      background: none; border: 0; color: var(--muted);
      font-size: 18px; cursor: pointer; padding: 4px 8px; line-height: 1; border-radius: 6px;
    }
    .ads-notice .an-close:hover { background: rgba(0,0,0,.05); color: var(--text); }
    .ads-notice.an-hide {
      animation: anSlideUp .35s ease forwards;
    }
    @keyframes anSlideUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site-header" onclick="kembaliKeMenu()">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <h1 style="margin:0">Link! Like! Activity Record</h1>
        <button class="dm-btn" id="dm-btn" onclick="event.stopPropagation();toggleDarkMode()" title="Toggle dark mode"></button>
      </div>
    </header>

    <!-- Period menu -->
    <div class="menu" id="menu">
      <p class="subtitle">Select a term</p>

      <!-- Continue Watching -->
      <div class="menu-section" id="continue-watching" style="display:none">
        <h3 class="section-title">Continue Watching</h3>
        <div class="cw-card" id="cw-card" onclick="bukaDariProgress()">
          <div class="cw-thumb" id="cw-thumb"><img id="cw-img" alt=""></div>
          <div class="cw-info">
            <div class="cw-term" id="cw-term"></div>
            <div class="cw-title" id="cw-title"></div>
          </div>
          <button class="cw-clear" onclick="event.stopPropagation();clearContinueWatching()">&times;</button>
        </div>
      </div>

      <div class="menu-section">
        <h3 class="section-title">Main Story</h3>
        <div class="menu-grid">
          <div class="menu-item" onclick="bukaPlaylist('103')"><div class="num">103</div><div class="label">Term</div></div>
          <div class="menu-item" onclick="bukaPlaylist('104')"><div class="num">104</div><div class="label">Term</div></div>
          <div class="menu-item" onclick="bukaPlaylist('105')"><div class="num">105</div><div class="label">Term</div></div>
        </div>
      </div>

      <div class="menu-section">
        <h3 class="section-title">Side Story</h3>
        <div class="menu-grid">
          <div class="menu-item" onclick="bukaPlaylist('102')"><div class="num">102</div><div class="label">Voiced Novel</div></div>
          <div class="menu-item" onclick="bukaPlaylist('dream')"><div class="num">Dream Interlude</div><div class="label"></div></div>
        </div>
      </div>
    </div>

    <!-- Episode list (sideways) -->
    <div class="view" id="episode-view">
      <button class="back-btn" onclick="kembaliKeMenu()">&larr; Back</button>
      <div class="episode-header">
        <h2 id="episode-title">Term</h2>
        <label class="toggle-switch" id="fes-toggle-episode">
          <input type="checkbox" id="fes-checkbox" checked onchange="toggleFes(event)">
          <span class="toggle-slider"></span>
          <span class="toggle-label">Include Fes×LIVE</span>
        </label>
      </div>
      <p class="hint" id="episode-hint"></p>
      <div id="episode-content"></div>
      <div class="note" id="episode-note"></div>
    </div>

    <!-- Player view -->
    <div class="view" id="player-view">
      <div class="player-bar">
        <button class="back-btn" onclick="kembaliKeEpisode()">&larr; Back to episodes</button>
        <label class="toggle-switch" id="fes-toggle-player">
          <input type="checkbox" id="fes-checkbox-player" checked onchange="toggleFes(event)">
          <span class="toggle-slider"></span>
          <span class="toggle-label">Include Fes×LIVE</span>
        </label>
      </div>
      <div class="player-top">
        <button class="nav-btn" id="prev-btn" onclick="navEpisode(-1)">&#8592; Prev</button>
        <span class="counter" id="player-counter"></span>
        <button class="nav-btn" id="next-btn" onclick="navEpisode(1)">Next &#8594;</button>
      </div>
      <div id="player-slot"></div>
      <div class="ads-notice" id="ads-notice" style="display:none">Ads come from the official Hasunosora channel. This website is non-profit.<button class="an-close" onclick="dismissAdsNotice(event)">&times;</button></div>
      <div class="player-meta">
        <div class="pm-ep" id="pm-ep"></div>
        <div class="pm-name" id="pm-name"></div>
      </div>
      <div class="summary-box" id="pm-summary"></div>
    </div>
  </div>

  <script>

        { "id": "svnqDimMTZU", "title": "102nd Year Shades of Stars Chapter 7 \"On your mark Part 2\"" },

    function toggleFes(e) {
      showFes = e.target.checked;
      document.getElementById('fes-checkbox').checked = showFes;
      document.getElementById('fes-checkbox-player').checked = showFes;
      try { localStorage.setItem('linklike-showfes', JSON.stringify(showFes)); } catch(e) {}
      const currentId = currentVideos[currentIndex]?.id;
      applyFesFilter();
      const inView = !!currentId && currentVideos.some(v => v.id === currentId);
      if (!inView) {
        // Current video was filtered out, find nearest non-fes video
        const origIdx = allVideos.findIndex(v => v.id === currentId);
        let targetIdx = -1;
        // Search forward first (next episode after Fes×LIVE)
        for (let i = origIdx + 1; i < allVideos.length; i++) {
          if (allVideos[i].type !== 'fes') { targetIdx = i; break; }
        }
        if (targetIdx === -1) {
          // No forward match, search backward
          for (let i = origIdx - 1; i >= 0; i--) {
            if (allVideos[i].type !== 'fes') { targetIdx = i; break; }
          }
        }
        const filteredIdx = targetIdx >= 0 ? currentVideos.findIndex(v => v.id === allVideos[targetIdx].id) : 0;
        currentIndex = filteredIdx >= 0 ? filteredIdx : 0;
        if (document.getElementById('player-view').classList.contains('active')) {
          saveProgress();
          renderPlayer();
        } else {
          renderEpisodeList();
        }
        return;
      }
      currentIndex = currentVideos.findIndex(v => v.id === currentId);
      if (document.getElementById('player-view').classList.contains('active')) {
        updatePlayerMeta();
      } else {
        renderEpisodeList();
      }
    }

    function applyFesFilter() {

    function renderEpisodeList() {
      const content = document.getElementById('episode-content');
      const hint = document.getElementById('episode-hint');

      if (currentVideos.length === 0) {
        hint.textContent = allVideos.length > 0 ? 'All Fes×LIVE hidden.' : 'The video list will be added here later.';
        content.innerHTML = '<div class="placeholder-box">' + (allVideos.length > 0 ? 'Fes×LIVE are hidden. Check "Include Fes×LIVE" to show them.' : 'No videos for this term yet.') + '</div>';
        return;
      }

      const epCount = currentVideos.filter(v => v.type !== 'fes').length;
      const fesCount = currentVideos.filter(v => v.type === 'fes').length;
      const parts = [];
      if (epCount > 0) parts.push(epCount + ' episode' + (epCount > 1 ? 's' : ''));
      if (fesCount > 0) parts.push(fesCount + ' Fes×LIVE');
      hint.textContent = parts.join(', ') || '';
      document.getElementById('episode-note').textContent =
        (currentPeriod === '105') ? 'Fes×LIVE will be added here in the future.' : '';
      content.innerHTML = '<div class="episode-row"></div><div class="ep-scrollbar"><div class="ep-scrollbar-thumb"></div></div>';
      const row = content.querySelector('.episode-row');
      currentVideos.forEach((v, i) => {
        const isFes = (v.type === 'fes');
        let epNo, name;
        if (isFes) {
          epNo = null;
          name = v.title;
        } else {
          const m = v.title.match(/(?:Episode|Chapter)\s*(\d+)/i);
          epNo = m ? m[1] : (i + 1);
          name = v.title
            .replace(/^\d+(?:st|nd|rd|th)\s+(?:Term|Year)\s+/i, '')
            .replace(/(?:Episode|Chapter)\s*\d+\s*/i, '')
            .replace(/\s*\[ENG SUB\]$/i, '')
            .trim();
        }

        // Thumbnail arc (HamP story art)
        let arc = null;
        if (currentPeriod === 'dream') {
          arc = (i === 0) ? '200001' : '200002';
        } else if (currentPeriod === '103' || currentPeriod === '104' || currentPeriod === '105') {
          if (currentPeriod === '104' && epNo === '13') {
            arc = '105012'; // 104 ep13 is the shared finale arc
          } else {
            arc = currentPeriod + '0' + String(epNo).padStart(2, '0');
          }
        }
        const ytThumb = 'https://i.ytimg.com/vi/' + v.id + '/hqdefault.jpg';
        const localThumb = arc ? 'thumbs/' + arc + '.webp' : null;
        const remoteThumb = arc ? 'https://storage.googleapis.com/llll-card/story/monthly/image_record_monthly_' + arc + '.webp' : null;
        // local copy first, then HamP remote, then YouTube so it still works if HamP vanishes
        const arcThumb = localThumb
          ? localThumb + '" onerror="this.onerror=null;this.src=\'' + remoteThumb + '\';this.onerror=function(){this.onerror=null;this.src=\'' + ytThumb + '\'};"'
          : null;

        const card = document.createElement('div');
        card.className = 'episode-card' + (isFes ? ' fes' : '');
        if (v.src === 'drive' || v.src === 'archive') {
          if (arcThumb) {
            // Drive has no public thumbnail, but we can borrow the HamP story-arc art
            card.innerHTML =
              '<img class="thumb" loading="lazy" src="' + arcThumb + '" alt="">' +
              '<div class="overlay"><div class="ec-ep">' + (isFes ? 'FES×LIVE' : 'EPISODE ' + epNo) + '</div>' +
              (isFes ? '' : '<div class="ec-name">' + name + '</div>') + '</div>';
          } else {
            // No arc art available: styled fallback
            card.classList.add('thumb-fallback');
            card.innerHTML =
              '<div class="overlay"><div class="ec-ep">' + (isFes ? 'FES×LIVE' : 'EPISODE ' + epNo) + '</div>' +
              (isFes ? '' : '<div class="ec-name">' + name + '</div>') + '</div>';
          }
        } else if (arcThumb) {
          // try HamP art; if it fails to load, fall back to YouTube thumb
          card.innerHTML =
            '<img class="thumb" loading="lazy" src="' + arcThumb + '" alt="" onerror="this.onerror=null;this.src=\'' + ytThumb + '\'">' +
            '<div class="overlay"><div class="ec-ep">' + (isFes ? 'FES×LIVE' : 'EPISODE ' + epNo) + '</div>' +
            (isFes ? '' : '<div class="ec-name">' + name + '</div>') + '</div>';
        } else {
          card.innerHTML =
            '<img class="thumb" loading="lazy" src="' + ytThumb + '" alt="">' +
            '<div class="overlay"><div class="ec-ep">' + (isFes ? 'FES×LIVE' : 'EPISODE ' + epNo) + '</div>' +
            (isFes ? '' : '<div class="ec-name">' + name + '</div>') + '</div>';
        }
        card.addEventListener('click', () => bukaEpisode(i));
        row.appendChild(card);
      });

      // Custom draggable scrollbar (works on touch + mouse)
      const sb = content.querySelector('.ep-scrollbar');
      const sbThumb = content.querySelector('.ep-scrollbar-thumb');
      function syncThumb() {
        const max = row.scrollWidth - row.clientWidth;
        const ratio = max > 0 ? row.scrollLeft / max : 0;
        const trackW = sb.clientWidth - sbThumb.offsetWidth;
        sbThumb.style.left = (ratio * trackW) + 'px';
      }
      function sizeThumb() {
        const max = row.scrollWidth - row.clientWidth;
        const w = max > 0 ? Math.max(28, row.clientWidth / row.scrollWidth * sb.clientWidth) : sb.clientWidth;
        sbThumb.style.width = w + 'px';
        syncThumb();
      }
      row.addEventListener('scroll', syncThumb, { passive: true });
      // PC: let the mouse wheel scroll the row horizontally (falls through to page at the edges)
      row.addEventListener('wheel', (e) => {
        const max = row.scrollWidth - row.clientWidth;
        if (max <= 0) return;
        const delta = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
        const atStart = row.scrollLeft <= 0;
        const atEnd = row.scrollLeft >= max - 1;
        if ((delta < 0 && atStart) || (delta > 0 && atEnd)) return;
        e.preventDefault();
        row.scrollLeft += delta;
      }, { passive: false });
      window.addEventListener('resize', sizeThumb);
      requestAnimationFrame(sizeThumb);

      let dragging = false, startX = 0, startLeft = 0;
      function thumbToScroll(clientX) {
        const max = row.scrollWidth - row.clientWidth;
        const trackW = sb.clientWidth - sbThumb.offsetWidth;
        const x = clientX - sb.getBoundingClientRect().left - sbThumb.offsetWidth / 2;
        const ratio = trackW > 0 ? Math.min(1, Math.max(0, x / trackW)) : 0;
        row.scrollLeft = ratio * max;
      }
      sbThumb.addEventListener('pointerdown', (e) => {
        dragging = true; startX = e.clientX; startLeft = sbThumb.offsetLeft;
        sbThumb.setPointerCapture(e.pointerId); e.preventDefault();
      });
      sbThumb.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        thumbToScroll(e.clientX);
      });
      sbThumb.addEventListener('pointerup', (e) => { dragging = false; });
      sbThumb.addEventListener('pointercancel', () => { dragging = false; });
      // tap/click anywhere on the track jumps there
      sb.addEventListener('pointerdown', (e) => {
        if (e.target === sbThumb) return;
        thumbToScroll(e.clientX);
      });
    }

    function bukaEpisode(index) {
      currentIndex = index;
      document.getElementById('episode-view').classList.remove('active');
      document.getElementById('player-view').classList.add('active');
      renderPlayer();
      location.hash = currentPeriod + '/' + index;
      window.scrollTo({ top: 0, behavior: 'auto' });
      saveProgress();
    }

    function renderPlayer() {
      const v = currentVideos[currentIndex];

      let embedSrc, embedAttrs, playerKind;
      if (v.src === 'drive') {
        embedSrc = 'https://drive.google.com/file/d/' + v.id + '/preview';
        embedAttrs = 'allow="autoplay; fullscreen" allowfullscreen';
        playerKind = 'drive';
      } else if (v.src === 'archive') {
        embedSrc = 'https://archive.org/embed/' + v.id;
        embedAttrs = 'allow="autoplay; fullscreen" allowfullscreen webkitallowfullscreen';
        playerKind = 'archive';
      } else {
        embedSrc = 'https://www.youtube.com/embed/' + v.id + '?autoplay=1&rel=0&modestbranding=1';
        embedAttrs = 'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen';
        playerKind = '';
      }

      const isFes = (v.type === 'fes');
      const epMatch = isFes ? null : v.title.match(/(?:Episode|Chapter)\s*(\d+)/i);
      const epNo = epMatch ? parseInt(epMatch[1], 10) : null;
      const showAds = (currentPeriod === '103' && !isFes && epNo !== null && epNo <= 10);
      const playerClass = 'player ' + playerKind + (isFes ? ' fes' : '');
      document.getElementById('player-slot').innerHTML =
        '<div class="' + playerClass + '"><iframe src="' + embedSrc +
        '" ' + embedAttrs + '></iframe></div>';
      document.getElementById('ads-notice').style.display = showAds ? '' : 'none';
      const adsEl = document.getElementById('ads-notice');
      adsEl.classList.remove('an-hide');
      if (adsEl._adsTimer) clearTimeout(adsEl._adsTimer);
      delete adsEl._adsTimer;
      if (showAds) {
        adsEl._adsTimer = setTimeout(() => {
          if (adsEl.style.display !== 'none') {
            adsEl.classList.add('an-hide');
            adsEl.addEventListener('animationend', () => { adsEl.style.display = 'none'; }, { once: true });
          }
        }, 5000);
      }
      updatePlayerMeta();
    }

    function updatePlayerMeta() {
      const v = currentVideos[currentIndex];
      if (!v) return;
      const isFes = (v.type === 'fes');
      let epNo, name;
      if (isFes) {
        epNo = null;
        name = v.title;
      } else {
        const m = v.title.match(/(?:Episode|Chapter)\s*(\d+)/i);
        epNo = m ? m[1] : (currentIndex + 1);
        name = v.title
          .replace(/^\d+(?:st|nd|rd|th)\s+(?:Term|Year)\s+/i, '')
          .replace(/(?:Episode|Chapter)\s*\d+\s*/i, '')
          .replace(/\s*\[ENG SUB\]$/i, '')
          .trim();
      }
      document.getElementById('pm-ep').textContent = isFes ? 'FES×LIVE' : 'EPISODE ' + epNo;
      document.getElementById('pm-name').textContent = name;
      const sumEl = document.getElementById('pm-summary');
      const sumText = (!isFes && epNo != null) ? summariesData[currentPeriod + '-' + epNo] : null;
      sumEl.innerHTML = sumText ? '<div class="sum-label">SUMMARY</div>' + sumText : '';
      const epCount = currentVideos.filter(v => v.type !== 'fes').length;
      const epPos = currentVideos.slice(0, currentIndex + 1).filter(v => v.type !== 'fes').length;
      document.getElementById('player-counter').textContent = isFes ? '' : (epPos + ' / ' + epCount);
      document.getElementById('prev-btn').disabled = (currentIndex === 0);
      document.getElementById('next-btn').disabled = (currentIndex === currentVideos.length - 1);
    }

    function navEpisode(step) {
      const ni = currentIndex + step;
      if (ni < 0 || ni >= currentVideos.length) return;
      currentIndex = ni;
      renderPlayer();
      location.hash = currentPeriod + '/' + currentIndex;
      window.scrollTo({ top: 0, behavior: 'auto' });
      saveProgress();
    }

      document.getElementById('episode-view').classList.remove('active');
      document.getElementById('player-view').classList.remove('active');
      document.getElementById('menu').classList.remove('active');
      history.replaceState(null, '', location.pathname + location.search);

    /* Continue Watching: save/load progress via localStorage */
    function saveProgress() {
      if (!currentPeriod || !currentVideos[currentIndex]) return;
      const v = currentVideos[currentIndex];
      const data = { period: currentPeriod, index: currentIndex, id: v.id, title: v.title, type: v.type || '', timestamp: Date.now() };
      try { localStorage.setItem('linklike-progress', JSON.stringify(data)); } catch(e) {}
    }

    function renderContinueWatching() {
      const cw = document.getElementById('continue-watching');
      try {
        const raw = localStorage.getItem('linklike-progress');
        if (!raw) { cw.style.display = 'none'; return; }
        const data = JSON.parse(raw);
        const list = playlists[data.period];
        if (!list || !list.some(v => v.id === data.id)) { cw.style.display = 'none'; return; }
        const v = list.find(item => item.id === data.id);
        const isFes = v.type === 'fes';
        // Build episode label
        let epLabel;
        if (isFes) { epLabel = 'FES×LIVE'; }
        else {
          const m = v.title.match(/(?:Episode|Chapter)\s*(\d+)/i);
          epLabel = m ? 'EPISODE ' + m[1] : '';
        }
        const periodLabel = (data.period === 'dream') ? 'Dream Interlude' : 'Term ' + data.period;
        // Title without prefix
        const cleanTitle = v.title
          .replace(/^\d+(?:st|nd|rd|th)\s+(?:Term|Year)\s+/i, '')
          .replace(/(?:Episode|Chapter)\s*\d+\s*/i, '')
          .replace(/\s*\[ENG SUB\]$/i, '')
          .trim();
        document.getElementById('cw-term').textContent = periodLabel + (isFes ? ' · ' + epLabel : ' · ' + epLabel);
        document.getElementById('cw-title').textContent = isFes ? v.title : cleanTitle;
        // Thumbnail
        const cwImg = document.getElementById('cw-img');
        let epNo = null;
        if (!isFes) {
          const m = v.title.match(/(?:Episode|Chapter)\s*(\d+)/i);
          epNo = m ? m[1] : null;
        }
        let arc = null;
        if (data.period === 'dream') { arc = (v.title.includes('Water') ? '200001' : '200002'); }
        else if (!isFes && (data.period === '103' || data.period === '104' || data.period === '105')) {
          arc = data.period + '0' + String(epNo).padStart(2, '0');
        }
        const localThumb = arc ? 'thumbs/' + arc + '.webp' : null;
        const remoteThumb = arc ? 'https://storage.googleapis.com/llll-card/story/monthly/image_record_monthly_' + arc + '.webp' : null;
        const ytThumb = 'https://i.ytimg.com/vi/' + v.id + '/hqdefault.jpg';
        if (localThumb) {
          cwImg.src = localThumb;
          cwImg.onerror = function() { this.onerror = null; this.src = remoteThumb || ytThumb; };
        } else {
          cwImg.src = ytThumb;
        }
        // Save period+videoId for click handler
        document.getElementById('cw-card').dataset.period = data.period;
        document.getElementById('cw-card').dataset.videoid = data.id;
        cw.style.display = '';
      } catch(e) { cw.style.display = 'none'; }
    }

    function bukaDariProgress() {
      const cw = document.getElementById('cw-card');
      const period = cw.dataset.period;
      const videoId = cw.dataset.videoid;
      if (!period || !videoId) return;
      bukaPlaylist(period);
      let idx = currentVideos.findIndex(v => v.id === videoId);
      if (idx < 0) {
        // Maybe filtered out by Fes toggle, auto-enable it
        const inAll = allVideos.findIndex(v => v.id === videoId);
        if (inAll >= 0 && !showFes) {
          showFes = true;
          document.getElementById('fes-checkbox').checked = true;
          document.getElementById('fes-checkbox-player').checked = true;
          try { localStorage.setItem('linklike-showfes', JSON.stringify(true)); } catch(e) {}
          applyFesFilter();
          idx = currentVideos.findIndex(v => v.id === videoId);
        }
      }
      if (idx < 0) { kembaliKeMenu(); return; }
      currentIndex = idx;
      document.getElementById('episode-view').classList.remove('active');
      document.getElementById('player-view').classList.add('active');
      renderPlayer();
      location.hash = period + '/' + currentIndex;
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function clearContinueWatching() {
      localStorage.removeItem('linklike-progress');
      document.getElementById('continue-watching').style.display = 'none';
    }

    function dismissAdsNotice(e) {
      if (e) e.stopPropagation();
      const el = document.getElementById('ads-notice');
      if (el._adsTimer) { clearTimeout(el._adsTimer); el._adsTimer = null; }
      if (el.style.display !== 'none') {
        el.classList.add('an-hide');
        el.addEventListener('animationend', () => { el.style.display = 'none'; }, { once: true });
      }
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      try { localStorage.setItem('linklike-darkmode', document.body.classList.contains('dark-mode') ? '1' : '0'); } catch(e) {}
    }

    // Keyboard navigation inside player view
    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('player-view').classList.contains('active')) return;
      if (e.key === 'ArrowLeft') navEpisode(-1);
      if (e.key === 'ArrowRight') navEpisode(1);
    });

    // Sync the visible view to the URL hash (called on load AND on browser back/forward)
    function applyHash() {
      const h = location.hash.replace(/^#/, '');
      if (!h) {
        // No hash → ensure we're on the menu (used by kembaliKeMenu's replaceState)
        document.getElementById('player-view').classList.remove('active');
        document.getElementById('episode-view').classList.remove('active');
        document.getElementById('menu').classList.remove('active');
        renderContinueWatching();
        return;
      }
      const parts = h.split('/');
      const kode = parts[0];
      if (!playlists[kode]) {
        // unknown hash → drop back to menu
        document.getElementById('player-view').classList.remove('active');
        document.getElementById('episode-view').classList.remove('active');
        document.getElementById('menu').classList.remove('active');
        renderContinueWatching();
        return;
      }
      bukaPlaylist(kode);
      if (parts[1] !== undefined) {
        const idx = parseInt(parts[1], 10);
        if (!isNaN(idx) && idx >= 0 && idx < currentVideos.length) {
          currentIndex = idx;
          document.getElementById('episode-view').classList.remove('active');
          document.getElementById('player-view').classList.add('active');
          renderPlayer();
          window.scrollTo({ top: 0, behavior: 'auto' });
        }
      } else {
        // hash is just a term → make sure we're on its episode list, not the player
        document.getElementById('player-view').classList.remove('active');
        document.getElementById('episode-view').classList.add('active');
      }
    }
    window.addEventListener('popstate', applyHash);
    applyHash();
  </script>
</body>
</html>
