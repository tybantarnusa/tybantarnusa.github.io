      currentPeriod = kode;

      applyFesFilter();

      document.getElementById('fes-toggle-episode').style.display = hasFes ? '' : 'none';
      document.getElementById('fes-toggle-player').style.display = hasFes ? '' : 'none';
      const fesToggleText = (kode === 'dream') ? 'Include LIVE/MV' : 'Include ' + fesWord(kode);
      document.querySelector('#fes-toggle-episode .toggle-label').textContent = fesToggleText;
      document.querySelector('#fes-toggle-player .toggle-label').textContent = fesToggleText;
      document.getElementById('menu').classList.add('active');
      document.getElementById('episode-view').classList.add('active');
      document.getElementById('episode-title').textContent =
        (kode === 'dream') ? 'Dream Interlude' : 'Term ' + kode;
      const _curKode = (location.hash.replace(/^#/, '').split('/'))[0];
      if (_curKode !== kode) location.hash = kode;

      renderEpisodeList();
    }

    function toggleFes(e) {
      showFes = e.target.checked;
      document.getElementById('fes-checkbox').checked = showFes;
      document.getElementById('fes-checkbox-player').checked = showFes;
      try { localStorage.setItem('linklike-showfes', JSON.stringify(showFes)); } catch(e) {}
      const currentId = currentVideos[currentIndex]?.id;
      applyFesFilter();
      const inView = !!currentId && currentVideos.some(v => v.id === currentId);
      if (!inView) {
        const origIdx = allVideos.findIndex(v => v.id === currentId);
        let targetIdx = -1;
        
        for (let i = origIdx + 1; i < allVideos.length; i++) {
          if (allVideos[i].type !== 'fes') { targetIdx = i; break; }
        }
        if (targetIdx === -1) {
          
          for (let i = origIdx - 1; i >= 0; i--) {
            if (allVideos[i].type !== 'fes') { targetIdx = i; break; }
          }
        }
        const filteredIdx = targetIdx >= 0 ? currentVideos.findIndex(v => v.id === allVideos[targetIdx].id) : 0;
        currentIndex = filteredIdx >= 0 ? filteredIdx : 0;
        if (document.getElementById('player-view').classList.contains('active')) {
          renderPlayer();
          saveProgress();
          if ((location.hash.replace(/^#/, '').split('/')[0]) === currentPeriod) history.replaceState(null, '', '#' + currentPeriod + '/' + currentIndex);
        } else {
          const oldRow = document.querySelector('.episode-row');
          const savedScroll = oldRow ? oldRow.scrollLeft : 0;
          renderEpisodeList();
          const newRow = document.querySelector('.episode-row');
          if (newRow) newRow.scrollLeft = savedScroll;
        }
        return;
      }
      currentIndex = currentVideos.findIndex(v => v.id === currentId);
      if (document.getElementById('player-view').classList.contains('active')) {
        updatePlayerMeta();
        if ((location.hash.replace(/^#/, '').split('/')[0]) === currentPeriod) history.replaceState(null, '', '#' + currentPeriod + '/' + currentIndex);
      } else {
        const oldRow = document.querySelector('.episode-row');
        const savedScroll = oldRow ? oldRow.scrollLeft : 0;
        renderEpisodeList();
        const newRow = document.querySelector('.episode-row');
        if (newRow) newRow.scrollLeft = savedScroll;
      }
    }

    function applyFesFilter() {
      currentVideos = showFes ? allVideos : allVideos.filter(v => v.type !== 'fes');
    }

    const TERM_SEQ = ['103', '104', '105'];
    function nextTermOf(k) { const i = TERM_SEQ.indexOf(k); return (i >= 0 && i < TERM_SEQ.length - 1) ? TERM_SEQ[i + 1] : null; }
    function prevTermOf(k) { const i = TERM_SEQ.indexOf(k); return (i > 0) ? TERM_SEQ[i - 1] : null; }
    function goToTerm(term, index) {
      currentPeriod = term;
      allVideos = playlists[term] || [];
      applyFesFilter();
      currentIndex = (index === 'last') ? Math.max(0, currentVideos.length - 1) : (index || 0);
      const hasFes = allVideos.some(v => v.type === 'fes');
      document.getElementById('fes-checkbox').checked = showFes;
      document.getElementById('fes-checkbox-player').checked = showFes;
      document.getElementById('fes-toggle-episode').style.display = hasFes ? '' : 'none';
      document.getElementById('fes-toggle-player').style.display = hasFes ? '' : 'none';
      document.getElementById('episode-view').classList.remove('active');
      document.getElementById('menu').classList.add('active');
      document.getElementById('player-view').classList.add('active');
      if ((location.hash.replace(/^#/, '').split('/')[0]) !== term) history.replaceState(null, '', '#' + term + '/' + currentIndex);
      renderPlayer();
      window.scrollTo({ top: 0, behavior: 'auto' });
      saveProgress();
    }

    function renderEpisodeList() {
      const content = document.getElementById('episode-content');
      const hint = document.getElementById('episode-hint');

      if (currentVideos.length === 0) {
        hint.textContent = allVideos.length > 0 ? 'All ' + fesWord(currentPeriod) + ' hidden.' : 'The video list will be added here later.';
        content.innerHTML = '<div class="placeholder-box">' + (allVideos.length > 0 ? fesWord(currentPeriod) + ' are hidden. Check "Include ' + fesWord(currentPeriod) + '" to show them.' : 'No videos for this term yet.') + '</div>';
        return;
      }

      const epCount = currentVideos.filter(v => v.type !== 'fes').length;
      const fesCount = currentVideos.filter(v => v.type === 'fes').length;
      const parts = [];
      if (epCount > 0) parts.push(epCount + ' episode' + (epCount > 1 ? 's' : ''));
      if (fesCount > 0) parts.push(fesCount + ' ' + fesWord(currentPeriod));
      hint.textContent = parts.join(', ') || '';
      document.getElementById('episode-note').textContent = '';
      content.innerHTML = '<div class="episode-row"></div><div class="ep-scrollbar"><div class="ep-scrollbar-thumb"></div></div>';
      const row = content.querySelector('.episode-row');
      currentVideos.forEach((v, i) => {
        const isFes = (v.type === 'fes');
        const fesLabel = fesWord(currentPeriod, v);
        const allIdx = allVideos.findIndex(x => x.id === v.id);
        const epPosAll = allIdx >= 0 ? allVideos.slice(0, allIdx + 1).filter(x => x.type !== 'fes').length : (i + 1);
        let epNo, name;
        if (isFes) {
          epNo = null;
          name = v.title;
        } else {
          const m = v.title.match(/(?:Episode|Chapter)\s*(\d+)/i);
          epNo = m ? m[1] : epPosAll;
          name = v.title
            .replace(/^\d+(?:st|nd|rd|th)\s+(?:Term|Year)\s+/i, '')
            .replace(/(?:Episode|Chapter)\s*\d+\s*/i, '')
            .replace(/^Shades of Stars\s+/i, '')
            .replace(/^Dream Interlude\s+/i, '')
            .replace(/\s*\[ENG SUB\]$/i, '')
            .trim();
        }

        
        let arc = null;
        if (isFes) {
          arc = 'fes-' + v.id;
        } else if (currentPeriod === 'dream') {
          if (!isFes) arc = '20000' + epPosAll;
        } else if (currentPeriod === '102' || currentPeriod === '103' || currentPeriod === '104' || currentPeriod === '105') {
          if (currentPeriod === '104' && epNo === '13') {
            arc = '105012'; 
          } else {
            arc = currentPeriod + '0' + String(epNo ?? epPosAll).padStart(2, '0');
          }
        }
        const ytThumb = ytThumbUrl(v.id);
        const localExt = (arc.indexOf('fes-') === 0 || arc.indexOf('102') === 0) ? '.jpg' : '.webp';
        const localThumb = arc ? 'thumbs/' + arc + localExt : null;
        const remoteThumb = arc ? 'https://storage.googleapis.com/llll-card/story/monthly/image_record_monthly_' + arc + '.webp' : null;
        
        const arcThumb = localThumb
          ? localThumb + '" onerror="this.onerror=null;this.src=\'' + remoteThumb + '\';this.onerror=function(){ytThumbFallback(this)}"'
          : null;

        const rightClass = (v.id === 'LLuRLXd41YM') ? ' thumb-right' : '';

        const card = document.createElement('div');
        card.className = 'episode-card' + (isFes ? ' fes' : '');
        if (v.src === 'drive' || v.src === 'archive') {
          if (arcThumb) {
            
            card.innerHTML =
              '<img class="thumb' + rightClass + '" loading="lazy" src="' + arcThumb + '" alt="">' +
              '<div class="overlay">' + (isFes ? '<div class="ec-ep">' + fesWordUp(currentPeriod, v) + '</div>' : '<div class="ec-ep">EPISODE ' + epNo + '</div>') +
              '<div class="ec-name">' + name + '</div>' + '</div>' +
              (isFes ? '<div class="fes-label">' + fesLabel + '</div>' : '');
          } else {
            
            card.classList.add('thumb-fallback');
            card.innerHTML =
              '<div class="overlay">' + (isFes ? '<div class="ec-ep">' + fesWordUp(currentPeriod, v) + '</div>' : '<div class="ec-ep">EPISODE ' + epNo + '</div>') +
              '<div class="ec-name">' + name + '</div>' + '</div>' +
              (isFes ? '<div class="fes-label">' + fesLabel + '</div>' : '');
          }
        } else if (arcThumb) {
          
          card.innerHTML =
            '<img class="thumb' + rightClass + '" loading="lazy" src="' + arcThumb + '" alt="" onerror="this.onerror=null;this.src=\'' + ytThumb + '\';ytThumbFallback(this)">' +
            '<div class="overlay">' + (isFes ? '<div class="ec-ep">' + fesWordUp(currentPeriod, v) + '</div>' : '<div class="ec-ep">EPISODE ' + epNo + '</div>') +
            '<div class="ec-name">' + name + '</div>' + '</div>' +
            (isFes ? '<div class="fes-label">' + fesLabel + '</div>' : '');
        } else {
          card.innerHTML =
            '<img class="thumb thumb-yt' + rightClass + '" loading="lazy" src="' + ytThumb + '" alt="" onerror="ytThumbFallback(this)">' +
            '<div class="overlay">' + (isFes ? '<div class="ec-ep">' + fesWordUp(currentPeriod, v) + '</div>' : '<div class="ec-ep">EPISODE ' + epNo + '</div>') +
            '<div class="ec-name">' + name + '</div>' + '</div>' +
            (isFes ? '<div class="fes-label">' + fesLabel + '</div>' : '');
        }
        card.addEventListener('click', () => bukaEpisode(i));
        row.appendChild(card);
        if (currentPeriod === 'dream' && currentVideos.length > i + 1 && currentVideos[i + 1].type === 'fes') {
          const conn = document.createElement('div');
          conn.className = 'dream-connector';
          row.appendChild(conn);
        }
      });

      
      const sb = content.querySelector('.ep-scrollbar');
      const sbThumb = content.querySelector('.ep-scrollbar-thumb');
      function syncThumb() {
        const max = row.scrollWidth - row.clientWidth;
        const ratio = max > 0 ? row.scrollLeft / max : 0;
        const trackW = sb.clientWidth - sbThumb.offsetWidth;
        sbThumb.style.left = (ratio * trackW) + 'px';
      }
      function sizeThumb() {
        const max = row.scrollWidth - row.clientWidth;
        const w = max > 0 ? Math.max(28, row.clientWidth / row.scrollWidth * sb.clientWidth) : sb.clientWidth;
        sbThumb.style.width = w + 'px';
        syncThumb();
      }
      row.addEventListener('scroll', syncThumb, { passive: true });
      
      row.addEventListener('wheel', (e) => {
        const max = row.scrollWidth - row.clientWidth;
        if (max <= 0) return;
        const delta = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
        const atStart = row.scrollLeft <= 0;
        const atEnd = row.scrollLeft >= max - 1;
        if ((delta < 0 && atStart) || (delta > 0 && atEnd)) return;
        e.preventDefault();
        row.scrollLeft += delta;
      }, { passive: false });
      window.addEventListener('resize', sizeThumb);
      requestAnimationFrame(sizeThumb);

      let dragging = false, startX = 0, startLeft = 0;
      function thumbToScroll(clientX) {
        const max = row.scrollWidth - row.clientWidth;
        const trackW = sb.clientWidth - sbThumb.offsetWidth;
        const x = clientX - sb.getBoundingClientRect().left - sbThumb.offsetWidth / 2;
        const ratio = trackW > 0 ? Math.min(1, Math.max(0, x / trackW)) : 0;
        row.scrollLeft = ratio * max;
      }
      sbThumb.addEventListener('pointerdown', (e) => {
        dragging = true; startX = e.clientX; startLeft = sbThumb.offsetLeft;
        sbThumb.setPointerCapture(e.pointerId); e.preventDefault();
      });
      sbThumb.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        thumbToScroll(e.clientX);
      });
      sbThumb.addEventListener('pointerup', (e) => { dragging = false; });
      sbThumb.addEventListener('pointercancel', () => { dragging = false; });
      
      sb.addEventListener('pointerdown', (e) => {
        if (e.target === sbThumb) return;
        thumbToScroll(e.clientX);
      });
    }

    function bukaEpisode(index) {
      currentIndex = index;
      document.getElementById('episode-view').classList.remove('active');
      document.getElementById('player-view').classList.add('active');
      renderPlayer();
      location.hash = currentPeriod + '/' + index;
      window.scrollTo({ top: 0, behavior: 'auto' });
      saveProgress();
    }

    function renderPlayer() {
      const v = currentVideos[currentIndex];

      let embedSrc, embedAttrs, playerKind;
      if (v.src === 'drive') {
        embedSrc = 'https://drive.google.com/file/d/' + v.id + '/preview';
        embedAttrs = 'allow="autoplay; fullscreen" allowfullscreen';
        playerKind = 'drive';
      } else if (v.src === 'archive') {
        embedSrc = 'https://archive.org/embed/' + v.id;
        embedAttrs = 'allow="autoplay; fullscreen" allowfullscreen webkitallowfullscreen';
        playerKind = 'archive';
      } else {
        embedSrc = 'https://www.youtube.com/embed/' + v.id + '?autoplay=1&rel=0&modestbranding=1' + (v.start ? '&start=' + v.start : '');
        embedAttrs = 'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen';
        playerKind = '';
      }

      const isFes = (v.type === 'fes');
      const epMatch = isFes ? null : v.title.match(/(?:Episode|Chapter)\s*(\d+)/i);
      const epNo = epMatch ? parseInt(epMatch[1], 10) : null;
      const showAds = (currentPeriod === '103' && ((!isFes && epNo !== null && epNo <= 10) || (isFes && v.id === 'KBnb1KbeocA'))) || (currentPeriod === 'dream' && (v.id === 'EdB_cM6AoEk' || v.id === 'byq4j290Aw4')) || (currentPeriod === '105' && v.id === 'qGFxoDblabA');
      const playerClass = 'player ' + playerKind + (isFes ? ' fes' : '');
      document.getElementById('player-slot').innerHTML =
        '<div class="' + playerClass + '"><iframe src="' + embedSrc +
        '" ' + embedAttrs + '></iframe></div>';
      document.getElementById('ads-notice').style.display = showAds ? '' : 'none';
      const adsEl = document.getElementById('ads-notice');
      adsEl.classList.remove('an-hide');
      if (adsEl._adsTimer) clearTimeout(adsEl._adsTimer);
      delete adsEl._adsTimer;
      if (showAds) {
        adsEl._adsTimer = setTimeout(() => {
          if (adsEl.style.display !== 'none') {
            adsEl.classList.add('an-hide');
            adsEl.addEventListener('animationend', () => { adsEl.style.display = 'none'; }, { once: true });
          }
        }, 5000);
      }
      updatePlayerMeta();
    }

    function updatePlayerMeta() {
      const v = currentVideos[currentIndex];
      if (!v) return;
      const isFes = (v.type === 'fes');
      let epNo, name;
      const allIdx = allVideos.findIndex(x => x.id === v.id);
      const epPosAll = allIdx >= 0 ? allVideos.slice(0, allIdx + 1).filter(x => x.type !== 'fes').length : (currentIndex + 1);
      if (isFes) {
        epNo = null;
        name = v.title;
      } else {
        const m = v.title.match(/(?:Episode|Chapter)\s*(\d+)/i);
        epNo = m ? m[1] : epPosAll;
        name = v.title
          .replace(/^\d+(?:st|nd|rd|th)\s+(?:Term|Year)\s+/i, '')
          .replace(/(?:Episode|Chapter)\s*\d+\s*/i, '')
          .replace(/^Shades of Stars\s+/i, '')
          .replace(/^Dream Interlude\s+/i, '')
          .replace(/\s*\[ENG SUB\]$/i, '')
          .trim();
      }
      document.getElementById('pm-ep').textContent = isFes ? fesWordUp(currentPeriod, v) : 'EPISODE ' + epNo;
      document.getElementById('pm-name').textContent = name;
      const sumEl = document.getElementById('pm-summary');
      let setlistHtml = '';
      if (isFes && v.setlist) {
        const items = v.setlist.map(s => '<div class="sl-item sl-' + (s.startsWith('MC') || s === 'Interlude' ? 'mc' : (s.endsWith('Dance Battle') ? 'special' : 'song')) + '">' + s + '</div>').join('');
        if (currentPeriod === 'dream') {
          setlistHtml = '<div class="sum-label">SETLIST</div><div class="setlist" style="display:flex">' + items + '</div>';
        } else {
          setlistHtml = '<div class="sum-label sl-toggle" id="sl-toggle" onclick="this.classList.toggle(\'sl-open\');this.querySelector(\'.sl-arrow\').textContent=this.classList.contains(\'sl-open\')?\'▼\':\'▶\'">SETLIST <span class="sl-arrow">▶</span></div><div class="setlist" id="sl-content">' + items + '</div>';
        }
      } else {
        let sumKey = null;
        if (currentPeriod === 'dream') {
          const epPos = epPosAll;
          sumKey = 'dream-' + epPos;
        } else if (epNo != null) {
          sumKey = currentPeriod + '-' + epNo;
        }
        const sumText = (!isFes && sumKey) ? summariesData[sumKey] : null;
        setlistHtml = sumText ? '<div class="sum-label">SUMMARY</div>' + sumText : '';
      }
      sumEl.innerHTML = setlistHtml;
      const epCount = currentVideos.filter(v => v.type !== 'fes').length;
      const epPos = currentVideos.slice(0, currentIndex + 1).filter(v => v.type !== 'fes').length;
      document.getElementById('player-counter').textContent = isFes ? fesWord(currentPeriod, v) : (epPos + ' / ' + epCount);
      const nb = document.getElementById('next-btn');
      const pb = document.getElementById('prev-btn');
      pb.disabled = (currentIndex === 0);
      if (currentIndex === 0) {
        const pt = prevTermOf(currentPeriod);
        pb.textContent = pt ? ('← Term ' + pt) : '← Prev';
        pb.disabled = !pt;
      } else {
        pb.textContent = '← Prev';
      }
      nb.disabled = (currentIndex === currentVideos.length - 1);
      if (currentIndex === currentVideos.length - 1) {
        const nt = nextTermOf(currentPeriod);
        nb.textContent = nt ? ('Term ' + nt + ' →') : 'Next →';
        nb.disabled = !nt;
      } else {
        nb.textContent = 'Next →';
      }
    }

    function navEpisode(step) {
      const ni = currentIndex + step;
      if (ni >= 0 && ni < currentVideos.length) {
        currentIndex = ni;
        renderPlayer();
        location.hash = currentPeriod + '/' + currentIndex;
        window.scrollTo({ top: 0, behavior: 'auto' });
        saveProgress();
        return;
      }
      if (currentPeriod === 'dream') return;
      const nt = step > 0 ? nextTermOf(currentPeriod) : prevTermOf(currentPeriod);
      if (!nt) return;
      goToTerm(nt, step > 0 ? 0 : 'last');
    }

    function kembaliKeEpisode() {
      document.getElementById('player-slot').innerHTML = ''; 
      document.getElementById('player-view').classList.remove('active');
      document.getElementById('episode-view').classList.add('active');
      location.hash = currentPeriod;
    }

    function kembaliKeMenu() {
      document.getElementById('player-slot').innerHTML = ''; 
      document.getElementById('episode-view').classList.remove('active');
      document.getElementById('player-view').classList.remove('active');
      document.getElementById('menu').classList.remove('active');
      history.replaceState(null, '', location.pathname + location.search);
      renderContinueWatching();
    }

    
    function saveProgress() {
      if (!currentPeriod || !currentVideos[currentIndex]) return;
      const v = currentVideos[currentIndex];
      const data = { period: currentPeriod, index: currentIndex, id: v.id, title: v.title, type: v.type || '', timestamp: Date.now() };
      try { localStorage.setItem('linklike-progress', JSON.stringify(data)); } catch(e) {}
    }

    function renderContinueWatching() {
      const cw = document.getElementById('continue-watching');
      try {
        const raw = localStorage.getItem('linklike-progress');
        if (!raw) { cw.style.display = 'none'; return; }
        const data = JSON.parse(raw);
        const list = playlists[data.period];
        if (!list || !list.some(v => v.id === data.id)) { cw.style.display = 'none'; return; }
        const v = list.find(item => item.id === data.id);
        const isFes = v.type === 'fes';
        const cwAllIdx = list.findIndex(x => x.id === v.id);
        const cwEpPos = cwAllIdx >= 0 ? list.slice(0, cwAllIdx + 1).filter(x => x.type !== 'fes').length : 1;

        let epLabel;
        if (isFes) { epLabel = fesWordUp(data.period, v); }
        else {
          const m = v.title.match(/(?:Episode|Chapter)\s*(\d+)/i);
          epLabel = 'EPISODE ' + (m ? m[1] : cwEpPos);
        }
        const periodLabel = (data.period === 'dream') ? 'Dream Interlude' : 'Term ' + data.period;
        
        const cleanTitle = v.title
          .replace(/^\d+(?:st|nd|rd|th)\s+(?:Term|Year)\s+/i, '')
          .replace(/(?:Episode|Chapter)\s*\d+\s*/i, '')
          .replace(/^Shades of Stars\s+/i, '')
          .replace(/^Dream Interlude\s+/i, '')
          .replace(/\s*\[ENG SUB\]$/i, '')
          .trim();
        document.getElementById('cw-term').textContent = periodLabel + (isFes ? ' · ' + epLabel : ' · ' + epLabel);
        document.getElementById('cw-title').textContent = isFes ? v.title : cleanTitle;
        
        const cwImg = document.getElementById('cw-img');
        let epNo = null;
        if (!isFes) {
          const m = v.title.match(/(?:Episode|Chapter)\s*(\d+)/i);
          epNo = m ? m[1] : null;
        }
        let arc = null;
        if (isFes) { arc = 'fes-' + v.id; }
        else if (data.period === 'dream') { if (!isFes) arc = '20000' + cwEpPos; }
        else if (!isFes && (data.period === '102' || data.period === '103' || data.period === '104' || data.period === '105')) {
          arc = data.period + '0' + String(epNo ?? cwEpPos).padStart(2, '0');
        }
        const localExt = (arc.indexOf('fes-') === 0 || arc.indexOf('102') === 0) ? '.jpg' : '.webp';
        const localThumb = arc ? 'thumbs/' + arc + localExt : null;
        const remoteThumb = arc ? 'https://storage.googleapis.com/llll-card/story/monthly/image_record_monthly_' + arc + '.webp' : null;
        const ytThumb = ytThumbUrl(v.id);
        if (localThumb) {
          cwImg.src = localThumb;
          cwImg.onerror = function() { this.onerror = null; this.src = remoteThumb || ytThumb; ytThumbFallback(this); };
        } else {
          cwImg.src = ytThumb;
          cwImg.onerror = function() { ytThumbFallback(this); };
        }
        
        document.getElementById('cw-card').dataset.period = data.period;
        document.getElementById('cw-card').dataset.videoid = data.id;
        cw.style.display = '';
      } catch(e) { cw.style.display = 'none'; }
    }

    function bukaDariProgress() {
      const cw = document.getElementById('cw-card');
      const period = cw.dataset.period;
      const videoId = cw.dataset.videoid;
      if (!period || !videoId) return;
      bukaPlaylist(period);
      let idx = currentVideos.findIndex(v => v.id === videoId);
      if (idx < 0) {
        
        const inAll = allVideos.findIndex(v => v.id === videoId);
        if (inAll >= 0 && !showFes) {
          showFes = true;
          document.getElementById('fes-checkbox').checked = true;
          document.getElementById('fes-checkbox-player').checked = true;
          try { localStorage.setItem('linklike-showfes', JSON.stringify(true)); } catch(e) {}
          applyFesFilter();
          idx = currentVideos.findIndex(v => v.id === videoId);
        }
      }
      if (idx < 0) { kembaliKeMenu(); return; }
      currentIndex = idx;
      document.getElementById('episode-view').classList.remove('active');
      document.getElementById('player-view').classList.add('active');
      renderPlayer();
      location.hash = period + '/' + currentIndex;
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function clearContinueWatching() {
      localStorage.removeItem('linklike-progress');
      document.getElementById('continue-watching').style.display = 'none';
    }

    function dismissAdsNotice(e) {
      if (e) e.stopPropagation();
      const el = document.getElementById('ads-notice');
      if (el._adsTimer) { clearTimeout(el._adsTimer); el._adsTimer = null; }
      if (el.style.display !== 'none') {
        el.classList.add('an-hide');
        el.addEventListener('animationend', () => { el.style.display = 'none'; }, { once: true });
      }
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      try { localStorage.setItem('linklike-darkmode', document.body.classList.contains('dark-mode') ? '1' : '0'); } catch(e) {}
    }

    
    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('player-view').classList.contains('active')) return;
      if (e.key === 'ArrowLeft') navEpisode(-1);
      if (e.key === 'ArrowRight') navEpisode(1);
    });

    
    function applyHash() {
      const h = location.hash.replace(/^#/, '');
      document.getElementById('player-slot').innerHTML = '';
      if (!h) {
        
        document.getElementById('player-view').classList.remove('active');
        document.getElementById('episode-view').classList.remove('active');
        document.getElementById('menu').classList.remove('active');
        renderContinueWatching();
        return;
      }
      const parts = h.split('/');
      const kode = parts[0];
      if (!playlists[kode]) {
        
        document.getElementById('player-view').classList.remove('active');
        document.getElementById('episode-view').classList.remove('active');
        document.getElementById('menu').classList.remove('active');
        renderContinueWatching();
        return;
      }
      bukaPlaylist(kode);
      if (parts[1] !== undefined) {
        const idx = parseInt(parts[1], 10);
        if (!isNaN(idx) && idx >= 0 && idx < currentVideos.length) {
          currentIndex = idx;
          document.getElementById('episode-view').classList.remove('active');
          document.getElementById('player-view').classList.add('active');
          renderPlayer();
          window.scrollTo({ top: 0, behavior: 'auto' });
        }
      } else {
        
        document.getElementById('player-view').classList.remove('active');
        document.getElementById('episode-view').classList.add('active');
      }
    }
    window.addEventListener('popstate', applyHash);
    applyHash();
  </script>
