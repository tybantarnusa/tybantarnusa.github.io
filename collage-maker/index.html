<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collage Maker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Collage">
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --border: #2a2f3a;
    --accent: #5b8cff;
    --accent-hover: #7aa2ff;
    --text: #e6e9ef;
    --muted: #9aa3b2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .layout {
    display: flex;
    gap: 24px;
    padding: 24px;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .controls {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    width: 280px;
    flex-shrink: 0;
  }
  .controls h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 12px;
  }
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    font-size: 13px;
    margin-bottom: 6px;
    color: var(--muted);
  }
  .row { display: flex; gap: 10px; align-items: center; }
  input[type="number"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
  }
  /* pan-y lets a vertical scroll pass through; only horizontal drags adjust it. */
  input[type="range"] { width: 100%; accent-color: var(--accent); touch-action: pan-y; }
  input[type="color"] {
    width: 44px; height: 34px; padding: 0;
    border: 1px solid var(--border);
    border-radius: 8px; background: var(--bg); cursor: pointer;
  }
  .val { font-size: 13px; color: var(--muted); min-width: 44px; text-align: right; }
  button {
    font-family: inherit;
    font-size: 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    padding: 9px 14px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { border-color: var(--accent); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    width: 100%;
    font-weight: 600;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; }
  .seg button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .seg button.active:hover { background: var(--accent-hover); }
  .stage { flex: 1; min-width: 320px; }
  .gridwrap {
    max-width: 640px;
    overflow-x: auto;
    overflow-y: hidden;
  }
  .grid {
    display: grid;
    gap: 6px;
    background: var(--border);
    padding: 6px;
    width: max-content;
  }
  .stage-actions { max-width: 640px; margin-top: 12px; }
  /* Auto-layout lives in its own toolbar above the grid, not next to Download. */
  .stage-toolbar { max-width: 640px; margin-bottom: 10px; display: flex; justify-content: flex-end; }
  .cell {
    position: relative;
    background: var(--panel);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    min-height: 40px;
  }
  .cell.filled { cursor: grab; touch-action: none; }
  .cell.filled.dragging { cursor: grabbing; }
  /* Simple mode: fit the whole image, no cropping or transforms. */
  .cell.simple { cursor: pointer; touch-action: auto; }
  /* position:relative keeps the contained image above the absolute .sq-bg fill. */
  .cell.simple > img { object-fit: contain; transform: none !important; position: relative; }
  /* Allow the grid to scroll on touch; reordering starts on a long-press. */
  .cell.simple.filled { cursor: grab; touch-action: pan-x pan-y; }
  .cell.simple.filled.dragging { cursor: grabbing; opacity: 0.5; }
  /* Square mode: 1:1 cells, image contained over a blur/color fill. */
  .cell.square { cursor: pointer; touch-action: auto; }
  .cell.square.filled { cursor: grab; touch-action: pan-x pan-y; }
  .cell.square.filled.dragging { cursor: grabbing; opacity: 0.5; }
  /* Blur/color gap-fill layer, shared by square and simple modes. */
  .cell .sq-bg { position: absolute; inset: 0; overflow: hidden; }
  .cell .sq-bg img {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scale(1.2);
  }
  .cell.square .sq-fg {
    position: relative;
    width: 100%; height: 100%;
    object-fit: contain;
  }
  .cell.drop-target { outline: 2px solid var(--accent); outline-offset: -2px; }
  .cell.base { outline: 2px solid var(--accent); outline-offset: -2px; }
  .cell span {
    color: var(--muted);
    font-size: 13px;
    pointer-events: none;
    padding: 8px;
    text-align: center;
  }
  .cell img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transform-origin: center;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  .cell .tools {
    position: absolute;
    top: 4px; right: 4px;
    display: none;
    gap: 4px;
  }
  .cell:hover .tools { display: flex; }
  /* Touch devices have no hover — keep the tools visible. */
  @media (hover: none) {
    .cell.filled .tools { display: flex; }
  }
  .cell .tools button {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    color: #fff;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    line-height: 1;
    padding: 0;
    touch-action: manipulation;
  }
  .cell .tools button:hover { background: rgba(0,0,0,0.85); }
  .cell .tools button.active { background: var(--accent); }
  .cell .tools button.active:hover { background: var(--accent-hover); }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  footer {
    position: relative;
    margin-top: 28px;
    padding: 24px 24px 30px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.8;
  }
  footer::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 2px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--accent), #978df0);
  }
  footer .footer-inner { max-width: 640px; margin: 0 auto; }
  footer p { margin: 2px 0; }
  footer .f-name {
    font-weight: 600;
    background: linear-gradient(90deg, var(--accent), #978df0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  footer .footer-note { font-size: 12px; opacity: 0.75; }
  .update-bar {
    position: fixed;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px 10px 16px;
    font-size: 14px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    z-index: 50;
  }
  .update-bar button {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
    padding: 7px 14px;
  }
  .update-bar button:hover { background: var(--accent-hover); }

  @media (max-width: 720px) {
    header { padding: 14px 16px; }
    header p { display: none; }
    .layout { flex-direction: column; padding: 16px; gap: 16px; }
    /* Grid first, settings below it. */
    .stage { order: -1; min-width: 0; width: 100%; }
    .controls { width: 100%; }
    .gridwrap { max-width: 100%; }
    .stage-actions { max-width: 100%; }
    footer { padding: 24px 16px 30px; }
    /* Bigger touch targets. */
    .cell .tools button { width: 30px; height: 30px; font-size: 16px; }
    input[type="number"] { padding: 10px; font-size: 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>Collage Maker</h1>
  <p>Choose a grid, drop in images, and export a single combined image — all in your browser.</p>
</header>

<div class="layout">
  <aside class="controls" id="controls">
    <h2>Mode</h2>
    <div class="field">
      <div class="seg">
        <button id="modeSimple" class="active">Collage</button>
        <button id="modeSquare">Square</button>
      </div>
    </div>

    <div id="gridOpts">
      <h2>Grid</h2>
      <div class="field">
        <label>Columns</label>
        <input type="number" id="cols" min="1" max="10" value="2">
      </div>
      <div class="field">
        <label>Rows</label>
        <input type="number" id="rows" min="1" max="10" value="2">
      </div>
    </div>

    <h2>Style</h2>
    <div class="field" id="gapField">
      <label>Gap: <span id="gapVal">0</span> px</label>
      <input type="range" id="gap" min="0" max="60" value="0">
    </div>
    <div class="field">
      <label>Output width: <span id="widthVal">1200</span> px</label>
      <input type="range" id="outWidth" min="400" max="4000" step="100" value="1200">
    </div>
    <div class="field" id="bgField">
      <label>Background</label>
      <div class="row">
        <input type="color" id="bgColor" value="#000000">
        <span class="val" id="bgVal">#000000</span>
      </div>
    </div>

    <div id="squareOpts" style="display:none">
      <h2>Gap Fill</h2>
      <div class="field">
        <div class="seg">
          <button id="fillBlur" class="active">Blur</button>
          <button id="fillColor">Color</button>
        </div>
      </div>
      <div class="field" id="blurField">
        <label>Blur strength: <span id="blurVal">4</span></label>
        <input type="range" id="blurStrength" min="0" max="10" value="4">
      </div>
      <div class="field" id="sqColorField" style="display:none">
        <label>Fill color</label>
        <div class="row">
          <input type="color" id="sqColor" value="#000000">
          <span class="val" id="sqVal">#000000</span>
        </div>
      </div>
    </div>

    <div class="field" style="margin-bottom:0">
      <button id="clear" style="width:100%">Clear all</button>
    </div>
  </aside>

  <main class="stage">
    <div class="stage-toolbar" id="autoToolbar">
      <button id="autoLayout" title="Picks the best row/column bases so images touch with as little empty space as possible">Auto layout</button>
    </div>
    <div class="gridwrap"><div class="grid" id="grid"></div></div>
    <div class="stage-actions">
      <button class="primary" id="download" disabled>Download</button>
    </div>
  </main>
</div>

<footer>
  <div class="footer-inner">
    <p class="footer-credit">Programmed with vibe by <span class="f-name">tybantarnusa</span> &middot; <span class="f-name">DeepSeek</span> &middot; <span class="f-name">Thya</span></p>
    <p class="footer-note">No uploads, everything runs locally in your browser.</p>
  </div>
</footer>

<input type="file" id="filePicker" accept="image/*" style="display:none">

<script>
(function () {
  const grid = document.getElementById('grid');
  const gridwrap = document.querySelector('.gridwrap');
  const colsInput = document.getElementById('cols');
  const rowsInput = document.getElementById('rows');
  const gapInput = document.getElementById('gap');
  const gapVal = document.getElementById('gapVal');
  const outWidth = document.getElementById('outWidth');
  const widthVal = document.getElementById('widthVal');
  const bgColor = document.getElementById('bgColor');
  const bgVal = document.getElementById('bgVal');
  const downloadBtn = document.getElementById('download');
  const clearBtn = document.getElementById('clear');
  const filePicker = document.getElementById('filePicker');
  const modeSimpleBtn = document.getElementById('modeSimple');
  const modeSquareBtn = document.getElementById('modeSquare');
  const squareOpts = document.getElementById('squareOpts');
  const bgField = document.getElementById('bgField');
  const gridOpts = document.getElementById('gridOpts');
  const gapField = document.getElementById('gapField');
  const autoBtn = document.getElementById('autoLayout');
  const autoToolbar = document.getElementById('autoToolbar');
  const fillBlurBtn = document.getElementById('fillBlur');
  const fillColorBtn = document.getElementById('fillColor');
  const blurField = document.getElementById('blurField');
  const blurStrengthInput = document.getElementById('blurStrength');
  const blurVal = document.getElementById('blurVal');
  const sqColor = document.getElementById('sqColor');
  const sqVal = document.getElementById('sqVal');
  const sqColorField = document.getElementById('sqColorField');

  // Each cell holds null or { img, colBase, rowBase }.
  let cells = [];
  let activeCell = -1;
  // Once the user drags the output-width slider, stop auto-defaulting it.
  let userSetWidth = false;
  // 'simple' | 'square'
  let mode = 'simple';
  // Square mode: how empty cell space is filled — blurred copy or solid color.
  let squareFill = 'blur';
  let squareColor = '#000000';
  // Blur strength as a percentage of the cell size (0 = sharp cover fill).
  let blurStrength = 4;
  // True only while a long-press reorder drag is in progress.
  let reordering = false;

  // Suppress the browser's touch scroll while a reorder drag is active.
  document.addEventListener('touchmove', function (e) {
    if (reordering) e.preventDefault();
  }, { passive: false });

  // The largest source image (by pixel area).
  function largestImage() {
    let best = null, bestArea = 0;
    for (const c of cells) {
      if (!c) continue;
      const area = c.img.naturalWidth * c.img.naturalHeight;
      if (area > bestArea) { bestArea = area; best = c.img; }
    }
    return best;
  }

  // Simple mode: variable column widths / row heights driven by per-column and
  // per-row base cells. A column base cell sets its column's width ratio; a row
  // base cell sets its row's height ratio. Both are solved together so every
  // base cell's own image fills its cell exactly — contain, no gaps.
  // Returns { colW, rowH } in ratio units.
  function computeUnits(cols, rows) {
    const fb = largestImage();
    const F = fb ? fb.naturalWidth / fb.naturalHeight : 1;
    const colW = new Array(cols).fill(F);
    const rowH = new Array(rows).fill(1);

    const bases = [];
    for (let i = 0; i < cells.length; i++) {
      const d = cells[i];
      if (!d) continue;
      const ratio = d.img.naturalWidth / d.img.naturalHeight;
      const c = i % cols, r = Math.floor(i / cols);
      if (d.colBase) bases.push({ c: c, r: r, ratio: ratio, col: true });
      if (d.rowBase) bases.push({ c: c, r: r, ratio: ratio, row: true });
    }
    // Gauss-Seidel pass: colW[c] = ratio * rowH[r]; rowH[r] = colW[c] / ratio.
    for (let iter = 0; iter < 6; iter++) {
      for (const b of bases) {
        if (b.col) colW[b.c] = b.ratio * rowH[b.r];
        if (b.row) rowH[b.r] = colW[b.c] / b.ratio;
      }
    }
    // Guard against degenerate base cycles: an inconsistent multiplicative
    // cycle can collapse the units toward zero or blow them up. Fall back to a
    // sane layout (no bases) so the grid never becomes invisible/exploded.
    const maxCol = Math.max.apply(null, colW);
    const minCol = Math.min.apply(null, colW);
    const maxRow = Math.max.apply(null, rowH);
    const minRow = Math.min.apply(null, rowH);
    if (!isFinite(maxCol) || !isFinite(maxRow) ||
        maxCol / minCol > 1000 || maxRow / minRow > 1000 ||
        maxCol < 0.05 || maxRow < 0.05) {
      for (let c = 0; c < cols; c++) colW[c] = F;
      for (let r = 0; r < rows; r++) rowH[r] = 1;
    }
    return { colW: colW, rowH: rowH };
  }

  function clampInt(input) {
    let v = parseInt(input.value, 10);
    if (isNaN(v)) v = parseInt(input.min, 10);
    v = Math.max(+input.min, Math.min(+input.max, v));
    input.value = v;
    return v;
  }

  function buildGrid() {
    // Square mode is a single-image 1:1 converter — always one cell.
    const cols = (mode === 'square') ? 1 : clampInt(colsInput);
    const rows = (mode === 'square') ? 1 : clampInt(rowsInput);
    const count = cols * rows;

    if (mode !== 'square') {
      const next = new Array(count).fill(null);
      for (let i = 0; i < count && i < cells.length; i++) next[i] = cells[i];
      cells = next;
    }

    const gapPx = (mode === 'square') ? 0 : parseInt(gapInput.value, 10);
    grid.style.gap = gapPx + 'px';
    grid.style.padding = gapPx + 'px';
    grid.style.background = (mode === 'square') ? squareColor : bgColor.value;

    // Fit cells to the available width, but never below MIN_CELL — past that the
    // grid grows beyond the wrapper and scrolls sideways instead of shrinking.
    const MIN_CELL = 180;
    const avail = (gridwrap.clientWidth || 640) - gapPx * (cols + 1);

    let cellW = 0;
    let simpleUnitW = null;
    if (mode === 'simple') {
      const units = computeUnits(cols, rows);
      const sum = units.colW.reduce(function (a, b) { return a + b; }, 0);
      let u = avail / sum;
      if (!isFinite(u)) u = MIN_CELL;
      const minColW = Math.min.apply(null, units.colW);
      const minRowH = Math.min.apply(null, units.rowH);
      if (u * minColW < MIN_CELL) u = MIN_CELL / minColW;
      if (u * minRowH < MIN_CELL) u = MIN_CELL / minRowH;
      grid.style.gridTemplateColumns = units.colW.map(function (w) {
        return (w * u).toFixed(2) + 'px';
      }).join(' ');
      grid.style.gridTemplateRows = units.rowH.map(function (h) {
        return (h * u).toFixed(2) + 'px';
      }).join(' ');
      simpleUnitW = units.colW.map(function (w) { return w * u; });
      cellW = units.colW[0] * u;
    } else {
      cellW = Math.floor(avail / cols);
      if (!isFinite(cellW) || cellW < MIN_CELL) cellW = MIN_CELL;
      grid.style.gridTemplateColumns = 'repeat(' + cols + ', ' + cellW + 'px)';
      grid.style.gridTemplateRows = '';
    }

    grid.innerHTML = '';
    const blurPx = Math.round(cellW * blurStrength / 100);
    for (let i = 0; i < count; i++) {
      // Simple mode cells vary in width — scale the gap-blur per column.
      const bpx = simpleUnitW
        ? Math.round(simpleUnitW[i % cols] * blurStrength / 100)
        : blurPx;
      grid.appendChild(makeCell(i, bpx));
    }
    updateDefaultWidth();
    updateDownloadState();
  }

  // Default the output width to the widest source image times the column count.
  function updateDefaultWidth() {
    if (userSetWidth) return;
    const cols = (mode === 'square') ? 1 : clampInt(colsInput);
    let baseW = 0;
    if (mode === 'square') {
      // A square output should keep the longer side's resolution.
      const c = cells[0];
      if (c) baseW = Math.max(c.img.naturalWidth, c.img.naturalHeight);
    } else if (mode === 'simple') {
      const img = largestImage();
      if (img) baseW = img.naturalWidth;
    }
    if (!baseW) return;
    const target = baseW * cols;
    if (target > +outWidth.max) outWidth.max = target;
    outWidth.value = target;
    widthVal.textContent = target;
  }

  function makeCell(i, blurPx) {
    const cell = document.createElement('div');
    cell.className = 'cell' + (mode === 'simple' ? ' simple' : mode === 'square' ? ' square' : '');
    cell.dataset.index = i;
    if (mode === 'square') cell.style.aspectRatio = '1';
    const data = cells[i];

    if (data) {
      cell.classList.add('filled');

      if (mode === 'square') {
        // Background layer: blurred copy of the image, or a solid fill color.
        if (squareFill === 'blur') {
          const bg = document.createElement('div');
          bg.className = 'sq-bg';
          const bgImg = document.createElement('img');
          bgImg.src = data.img.src;
          bgImg.style.filter = 'blur(' + blurPx + 'px)';
          bg.appendChild(bgImg);
          cell.appendChild(bg);
        } else {
          cell.style.background = squareColor;
        }
        // Foreground layer: whole image contained, centered.
        const fg = document.createElement('img');
        fg.className = 'sq-fg';
        fg.src = data.img.src;
        cell.appendChild(fg);
      } else {
        // Blur/color gap fill behind the contained image, like square mode.
        if (squareFill === 'blur') {
          const bg = document.createElement('div');
          bg.className = 'sq-bg';
          const bgImg = document.createElement('img');
          bgImg.src = data.img.src;
          bgImg.style.filter = 'blur(' + blurPx + 'px)';
          bg.appendChild(bgImg);
          cell.appendChild(bg);
        } else {
          cell.style.background = squareColor;
        }
        const cimg = document.createElement('img');
        cimg.src = data.img.src;
        cell.appendChild(cimg);
      }

      const tools = document.createElement('div');
      tools.className = 'tools';

      const colBase = document.createElement('button');
      colBase.textContent = '↕';
      colBase.title = 'Set as column base (column width)';
      if (data.colBase) colBase.classList.add('active');
      colBase.addEventListener('click', function (e) {
        e.stopPropagation();
        setColBase(i, data);
      });

      const rowBase = document.createElement('button');
      rowBase.textContent = '↔';
      rowBase.title = 'Set as row base (row height)';
      if (data.rowBase) rowBase.classList.add('active');
      rowBase.addEventListener('click', function (e) {
        e.stopPropagation();
        setRowBase(i, data);
      });

      const replace = document.createElement('button');
      replace.textContent = '⟳';
      replace.title = 'Replace image';
      replace.addEventListener('click', function (e) {
        e.stopPropagation();
        activeCell = i;
        filePicker.click();
      });

      const rm = document.createElement('button');
      rm.textContent = '×';
      rm.title = 'Remove';
      rm.addEventListener('click', function (e) {
        e.stopPropagation();
        cells[i] = null;
        buildGrid();
      });

      if (mode === 'simple') {
        tools.appendChild(colBase);
        tools.appendChild(rowBase);
      }
      tools.appendChild(replace);
      tools.appendChild(rm);
      cell.appendChild(tools);

      enableReorder(cell, i);
    } else {
      const span = document.createElement('span');
      span.textContent = '+ Add image';
      cell.appendChild(span);
      cell.addEventListener('click', function () {
        activeCell = i;
        filePicker.click();
      });
    }
    return cell;
  }

  // Simple mode base selection — one base per column / per row. Clicking an
  // active base again removes it; picking a new one clears the old in that unit.
  function setColBase(i, data) {
    const cols = clampInt(colsInput);
    if (data.colBase) { data.colBase = false; buildGrid(); return; }
    for (let idx = i % cols; idx < cells.length; idx += cols) {
      if (cells[idx] && cells[idx] !== data) cells[idx].colBase = false;
    }
    data.colBase = true;
    buildGrid();
  }

  function setRowBase(i, data) {
    const cols = clampInt(colsInput);
    const start = Math.floor(i / cols) * cols;
    if (data.rowBase) { data.rowBase = false; buildGrid(); return; }
    for (let idx = start; idx < start + cols; idx++) {
      if (cells[idx] && cells[idx] !== data) cells[idx].rowBase = false;
    }
    data.rowBase = true;
    buildGrid();
  }

  // Auto layout (simple mode): pick the best column/row base cells so every
  // filled cell fits its image as tightly as possible — minimal empty space.
  // Coordinate descent: try every candidate in each column, then each row,
  // keep whatever reduces the weighted total gap, repeat a few times.
  function autoPickBases() {
    const cols = clampInt(colsInput);
    const rows = clampInt(rowsInput);
    if (mode !== 'simple' || cols * rows === 0) return;

    for (const d of cells) {
      if (d) { d.colBase = false; d.rowBase = false; }
    }
    if (!cells.some(Boolean)) { buildGrid(); return; }

    function clearCol(c) {
      for (let r = 0; r < rows; r++) {
        const d = cells[r * cols + c];
        if (d) d.colBase = false;
      }
    }
    function clearRow(r) {
      for (let c = 0; c < cols; c++) {
        const d = cells[r * cols + c];
        if (d) d.rowBase = false;
      }
    }

    // Weighted empty-space total for the current base selection. A cell's fit
    // is min(cellAspect/imgRatio, imgRatio/cellAspect) in 0..1; weight by the
    // cell's relative area so big cells count more. Units are normalized first
    // so a degenerate solver scale can't make the total look artificially small.
    function totalGap() {
      const units = computeUnits(cols, rows);
      const sumW = units.colW.reduce(function (a, b) { return a + b; }, 0);
      const sumH = units.rowH.reduce(function (a, b) { return a + b; }, 0);
      const nw = units.colW.map(function (w) { return w / sumW * cols; });
      const nh = units.rowH.map(function (h) { return h / sumH * rows; });
      let total = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const d = cells[r * cols + c];
          if (!d) continue;
          const ratio = d.img.naturalWidth / d.img.naturalHeight;
          const cellAspect = units.colW[c] / units.rowH[r];
          const fit = Math.min(cellAspect / ratio, ratio / cellAspect);
          total += (1 - fit) * nw[c] * nh[r];
        }
      }
      return total;
    }

    for (let iter = 0; iter < 4; iter++) {
      for (let c = 0; c < cols; c++) {
        const cands = [-1];
        for (let r = 0; r < rows; r++) if (cells[r * cols + c]) cands.push(r * cols + c);
        let bestIdx = -1, bestGap = Infinity;
        clearCol(c);
        for (const idx of cands) {
          if (idx >= 0) cells[idx].colBase = true;
          const g = totalGap();
          if (g < bestGap) { bestGap = g; bestIdx = idx; }
          if (idx >= 0) cells[idx].colBase = false;
        }
        if (bestIdx >= 0) cells[bestIdx].colBase = true;
      }
      for (let r = 0; r < rows; r++) {
        const cands = [-1];
        for (let c = 0; c < cols; c++) if (cells[r * cols + c]) cands.push(r * cols + c);
        let bestIdx = -1, bestGap = Infinity;
        clearRow(r);
        for (const idx of cands) {
          if (idx >= 0) cells[idx].rowBase = true;
          const g = totalGap();
          if (g < bestGap) { bestGap = g; bestIdx = idx; }
          if (idx >= 0) cells[idx].rowBase = false;
        }
        if (bestIdx >= 0) cells[bestIdx].rowBase = true;
      }
    }

    buildGrid();
  }

  function clearDropTargets() {
    grid.querySelectorAll('.cell.drop-target').forEach(function (c) {
      c.classList.remove('drop-target');
    });
  }

  // Simple mode: reorder with a long press (touch) or a drag (mouse). Touch:
  // holding still for 500ms only "arms" the reorder; moving after that starts
  // it, so ordinary scroll swipes never drag a photo around.
  function enableReorder(cell, i) {
    let pointerId = null, startX = 0, startY = 0;
    let dragging = false, armed = false, pressTimer = null, curX = 0, curY = 0, raf = null;

    function highlight(clientX, clientY) {
      const el = document.elementFromPoint(clientX, clientY);
      const target = el && el.closest('.cell');
      grid.querySelectorAll('.cell.drop-target').forEach(function (c) {
        if (c !== target) c.classList.remove('drop-target');
      });
      if (target && target !== cell) target.classList.add('drop-target');
      return target;
    }

    // While dragging near a horizontal edge, keep scrolling so off-screen
    // columns can be reached.
    function autoScroll() {
      if (!dragging) { raf = null; return; }
      const r = gridwrap.getBoundingClientRect();
      const edge = 48;
      if (curX < r.left + edge) gridwrap.scrollLeft -= 12;
      else if (curX > r.right - edge) gridwrap.scrollLeft += 12;
      raf = requestAnimationFrame(autoScroll);
    }

    function beginDrag() {
      dragging = true;
      reordering = true;
      cell.classList.add('dragging');
      try { cell.setPointerCapture(pointerId); } catch (_) {}
      if (navigator.vibrate) navigator.vibrate(15);
      curX = startX; curY = startY;
      if (!raf) raf = requestAnimationFrame(autoScroll);
    }

    function cancelPress() {
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    }

    cell.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      pointerId = e.pointerId;
      startX = curX = e.clientX; startY = curY = e.clientY;
      dragging = false; armed = false;
      if (e.pointerType !== 'mouse') {
        // Hold without moving arms the reorder; movement after that drags.
        pressTimer = setTimeout(function () { pressTimer = null; armed = true; }, 500);
      }
    });

    cell.addEventListener('pointermove', function (e) {
      if (pointerId !== e.pointerId) return;
      curX = e.clientX; curY = e.clientY;
      if (dragging) { highlight(e.clientX, e.clientY); return; }
      const moved = Math.hypot(e.clientX - startX, e.clientY - startY);
      if (e.pointerType === 'mouse') {
        if (moved > 6 && (e.buttons & 1)) beginDrag();
      } else if (armed) {
        if (moved > 8) beginDrag();
      } else if (pressTimer && moved > 10) {
        cancelPress();
      }
    });

    function finish(e) {
      if (pointerId !== e.pointerId) return;
      pointerId = null;
      cancelPress();
      armed = false;
      if (dragging) {
        const target = highlight(e.clientX, e.clientY);
        clearDropTargets();
        dragging = false;
        reordering = false;
        cell.classList.remove('dragging');
        if (target && target !== cell) {
          const j = parseInt(target.dataset.index, 10);
          if (!isNaN(j) && j !== i) {
            const tmp = cells[i]; cells[i] = cells[j]; cells[j] = tmp;
            buildGrid();
          }
        }
        return;
      }
      cell.classList.remove('dragging');
    }
    cell.addEventListener('pointerup', finish);
    cell.addEventListener('pointercancel', finish);
  }

  function updateDownloadState() {
    if (mode === 'square') {
      downloadBtn.disabled = !cells[0];
    } else {
      downloadBtn.disabled = !cells.some(Boolean);
    }
  }

  filePicker.addEventListener('change', function () {
    const file = filePicker.files && filePicker.files[0];
    filePicker.value = '';
    if (!file || activeCell < 0) return;
    const reader = new FileReader();
    reader.onload = function (e) {
      const img = new Image();
      img.onload = function () {
        cells[activeCell] = { img: img };
        buildGrid();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });

  function renderCanvas() {
    const cols = (mode === 'square') ? 1 : clampInt(colsInput);
    const rows = (mode === 'square') ? 1 : clampInt(rowsInput);
    const gap = (mode === 'square') ? 0 : parseInt(gapInput.value, 10);
    const totalW = parseInt(outWidth.value, 10);

    // Column widths and row heights in px — same ratios as the on-screen grid,
    // only scaled so the total width matches the requested output width.
    let colPx, rowPx, totalH;
    if (mode === 'simple') {
      const units = computeUnits(cols, rows);
      const sum = units.colW.reduce(function (a, b) { return a + b; }, 0);
      const scale = (totalW - gap * (cols + 1)) / sum;
      colPx = units.colW.map(function (w) { return w * scale; });
      rowPx = units.rowH.map(function (h) { return h * scale; });
      totalH = rowPx.reduce(function (a, b) { return a + b; }, 0) + gap * (rows + 1);
    } else {
      const cellW = (totalW - gap * (cols + 1)) / cols;
      colPx = new Array(cols).fill(cellW);
      rowPx = new Array(rows).fill(cellW);
      totalH = cellW * rows + gap * (rows + 1);
    }

    const canvas = document.createElement('canvas');
    canvas.width = Math.round(totalW);
    canvas.height = Math.round(totalH);
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = bgColor.value;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    let y = gap;
    for (let r = 0; r < rows; r++) {
      let x = gap;
      for (let c = 0; c < cols; c++) {
        const idx = r * cols + c;
        const data = cells[idx];
        if (data) drawCell(ctx, data, x, y, colPx[c], rowPx[r]);
        x += colPx[c] + gap;
      }
      y += rowPx[r] + gap;
    }
    return canvas;
  }

  function drawCell(ctx, data, cellX, cellY, cellW, cellH) {
    const img = data.img;
    ctx.save();
    ctx.beginPath();
    ctx.rect(cellX, cellY, cellW, cellH);
    ctx.clip();

    // Fill the leftover space with a blurred copy (or solid color), then
    // contain the whole image on top — same look as the on-screen grid.
    if (squareFill === 'blur') {
      drawBlurredFill(ctx, img, cellX, cellY, cellW, cellH);
    } else {
      ctx.fillStyle = squareColor;
      ctx.fillRect(cellX, cellY, cellW, cellH);
    }
    const scale = Math.min(cellW / img.width, cellH / img.height);
    const finalW = img.width * scale;
    const finalH = img.height * scale;
    ctx.drawImage(img, cellX + (cellW - finalW) / 2, cellY + (cellH - finalH) / 2, finalW, finalH);

    ctx.restore();
  }

  // Square mode: fill the cell with a blurred copy of the image (cover-fit).
  function drawBlurredFill(ctx, img, cellX, cellY, cellW, cellH) {
    const coverScale = Math.max(cellW / img.width, cellH / img.height);
    const bw = img.width * coverScale;
    const bh = img.height * coverScale;
    const bx = cellX + (cellW - bw) / 2;
    const by = cellY + (cellH - bh) / 2;
    const blurPx = Math.round(cellW * blurStrength / 100);
    if (blurPx <= 0) {
      ctx.drawImage(img, bx, by, bw, bh);
      return;
    }
    if (ctx.filter) {
      ctx.save();
      ctx.filter = 'blur(' + blurPx + 'px)';
      ctx.drawImage(img, bx, by, bw, bh);
      ctx.restore();
    } else {
      // Fallback (older Safari): downscale to a tiny canvas, then stretch back
      // with smoothing — a soft wash without ctx.filter support.
      const div = Math.max(8, blurPx);
      const off = document.createElement('canvas');
      off.width = Math.max(2, Math.round(bw / div));
      off.height = Math.max(2, Math.round(bh / div));
      const octx = off.getContext('2d');
      octx.drawImage(img, 0, 0, off.width, off.height);
      ctx.save();
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(off, bx, by, bw, bh);
      ctx.restore();
    }
  }

  downloadBtn.addEventListener('click', function () {
    const canvas = renderCanvas();
    canvas.toBlob(function (blob) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'collage.png';
      a.click();
      URL.revokeObjectURL(url);
    }, 'image/png');
  });

  clearBtn.addEventListener('click', function () {
    cells = cells.map(function () { return null; });
    buildGrid();
  });

  autoBtn.addEventListener('click', autoPickBases);

  function setMode(m) {
    mode = m;
    modeSimpleBtn.classList.toggle('active', m === 'simple');
    modeSquareBtn.classList.toggle('active', m === 'square');
    squareOpts.style.display = (m === 'square' || m === 'simple') ? '' : 'none';
    bgField.style.display = (m === 'square') ? 'none' : '';
    gridOpts.style.display = (m === 'square') ? 'none' : '';
    gapField.style.display = (m === 'square') ? 'none' : '';
    autoToolbar.style.display = (m === 'simple') ? '' : 'none';
    buildGrid();
  }
  modeSimpleBtn.addEventListener('click', function () { setMode('simple'); });
  modeSquareBtn.addEventListener('click', function () { setMode('square'); });

  window.addEventListener('resize', buildGrid);

  colsInput.addEventListener('change', buildGrid);
  rowsInput.addEventListener('change', buildGrid);
  gapInput.addEventListener('input', function () {
    gapVal.textContent = gapInput.value;
    buildGrid();
  });
  outWidth.addEventListener('input', function () {
    userSetWidth = true;
    widthVal.textContent = outWidth.value;
  });
  bgColor.addEventListener('input', function () {
    bgVal.textContent = bgColor.value;
    grid.style.background = (mode === 'square') ? squareColor : bgColor.value;
  });

  function setSquareFill(fill) {
    squareFill = fill;
    fillBlurBtn.classList.toggle('active', fill === 'blur');
    fillColorBtn.classList.toggle('active', fill === 'color');
    blurField.style.display = (fill === 'blur') ? '' : 'none';
    sqColorField.style.display = (fill === 'color') ? '' : 'none';
    buildGrid();
  }
  fillBlurBtn.addEventListener('click', function () { setSquareFill('blur'); });
  fillColorBtn.addEventListener('click', function () { setSquareFill('color'); });
  blurStrengthInput.addEventListener('input', function () {
    blurStrength = parseInt(blurStrengthInput.value, 10);
    blurVal.textContent = blurStrength;
    buildGrid();
  });
  sqColor.addEventListener('input', function () {
    squareColor = sqColor.value;
    sqVal.textContent = squareColor;
    grid.style.background = squareColor;
    grid.querySelectorAll('.cell.square').forEach(function (c) {
      c.style.background = squareColor;
    });
  });

  setMode('simple');
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('service-worker.js').then(function (reg) {
      function offerUpdate(worker) {
        showUpdateBar(function () { worker.postMessage('SKIP_WAITING'); });
      }
      if (reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);
      reg.addEventListener('updatefound', function () {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) offerUpdate(nw);
        });
      });
    }).catch(function () {});

    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (reloading) return;
      reloading = true;
      window.location.reload();
    });
  });
}

function showUpdateBar(onReload) {
  if (document.getElementById('updateBar')) return;
  const bar = document.createElement('div');
  bar.id = 'updateBar';
  bar.className = 'update-bar';
  const label = document.createElement('span');
  label.textContent = 'A new version is available.';
  const btn = document.createElement('button');
  btn.textContent = 'Reload';
  btn.addEventListener('click', function () { btn.disabled = true; onReload(); });
  bar.appendChild(label);
  bar.appendChild(btn);
  document.body.appendChild(bar);
}
</script>
</body>
</html>
