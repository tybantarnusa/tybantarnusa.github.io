<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jadwal Anime</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0c10;
      --bg-2: #0d1016;
      --surface: #131720;
      --surface-2: #1a1f2c;
      --border: rgba(255, 255, 255, 0.06);
      --border-strong: rgba(255, 255, 255, 0.12);
      --text: #eceef4;
      --muted: #8b93a6;
      --faint: #5b6372;
      --accent: #ff4d5c;
      --accent-2: #ff9a3d;
      --amber: #ffb37a;
      --accent-soft: rgba(255, 77, 92, 0.12);
      --mono: 'JetBrains Mono', ui-monospace, monospace;
      --display: 'Space Grotesk', 'Segoe UI', sans-serif;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* latar glow tipis */
    .bg-glow {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(900px 420px at 50% -10%, rgba(255, 77, 92, 0.10), transparent 60%),
        radial-gradient(700px 500px at 85% 110%, rgba(255, 154, 61, 0.06), transparent 60%),
        var(--bg);
    }

    /* ===== Topbar ===== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 24px;
      background: rgba(10, 12, 16, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid;
      place-items: center;
      font-family: var(--mono);
      font-weight: 700;
      font-size: 13px;
      color: #0a0c10;
      box-shadow: 0 4px 18px rgba(255, 77, 92, 0.35);
    }

    .brand-name {
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .onair-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--accent);
      padding: 5px 11px;
      border: 1px solid rgba(255, 77, 92, 0.35);
      border-radius: 999px;
      background: var(--accent-soft);
      white-space: nowrap;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      animation: pulse 1.8s ease-out infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 77, 92, 0.55); }
      70% { box-shadow: 0 0 0 7px rgba(255, 77, 92, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 77, 92, 0); }
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* ===== Season switch ===== */
    .season-switch {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 4px;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      background: var(--surface);
      white-space: nowrap;
    }

    .season-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--muted);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 999px;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .season-tab:hover { color: var(--text); }

    .season-tab.active {
      color: #0a0c10;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .season-tab .tab-tag {
      font-size: 8.5px;
      letter-spacing: 1px;
      padding: 2px 5px;
      border-radius: 999px;
      background: rgba(255, 154, 61, 0.16);
      color: var(--amber);
    }

    .season-tab.active .tab-tag {
      background: rgba(10, 12, 16, 0.22);
      color: #0a0c10;
    }

    /* ===== Season note (musim depan) ===== */
    .season-note {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 14px;
      padding: 11px 15px;
      margin-bottom: 18px;
      border-radius: 12px;
      border: 1px dashed rgba(255, 154, 61, 0.32);
      background: rgba(255, 154, 61, 0.05);
      font-size: 12.5px;
      color: var(--muted);
    }

    .season-note b { color: var(--text); font-weight: 600; }

    .note-tag {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--amber);
    }

    .refresh-btn {
      font-family: var(--display);
      font-weight: 700;
      font-size: 13px;
      color: #0a0c10;
      border: none;
      cursor: pointer;
      padding: 10px 18px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      transition: transform 0.15s ease, filter 0.15s ease;
      white-space: nowrap;
    }

    .refresh-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .refresh-btn:active { transform: translateY(0); }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    /* ===== Next up ===== */
    .nextup {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      margin-bottom: 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 154, 61, 0.28);
      background: linear-gradient(90deg, rgba(255, 77, 92, 0.10), rgba(255, 154, 61, 0.06));
      overflow: hidden;
    }

    .nextup-label {
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--amber);
      white-space: nowrap;
    }

    .nextup-main {
      display: flex;
      align-items: baseline;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .nextup-time {
      font-family: var(--mono);
      font-weight: 700;
      color: var(--text);
    }

    .nextup-title {
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nextup-count {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--amber);
      white-space: nowrap;
    }

    /* ===== Today strip ===== */
    .today-strip {
      margin-bottom: 22px;
    }

    .strip-head {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 10px;
    }

    .strip-label {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
    }

    .chips {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: thin;
      scrollbar-color: var(--surface-2) transparent;
    }

    .chips::-webkit-scrollbar { height: 6px; }
    .chips::-webkit-scrollbar-thumb { background: var(--surface-2); border-radius: 999px; }

    .chip-item {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 14px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .chip-item:hover { border-color: var(--border-strong); background: var(--surface-2); }

    .chip-time {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--amber);
    }

    .chip-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
    }

    /* ===== Day nav ===== */
    .day-nav {
      position: sticky;
      top: 60px;
      z-index: 40;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 0;
      margin-bottom: 8px;
      background: rgba(10, 12, 16, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      scrollbar-width: none;
    }

    .day-nav::-webkit-scrollbar { display: none; }

    .day-pill {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 15px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }

    .day-pill:hover { border-color: var(--border-strong); color: var(--text); }

    .day-pill .pill-count {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--faint);
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 7px;
      border-radius: 999px;
    }

    .day-pill.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
      color: #0a0c10;
    }

    .day-pill.active .pill-count {
      background: rgba(0, 0, 0, 0.18);
      color: #0a0c10;
    }

    /* ===== Day cards ===== */
    .schedule { display: flex; flex-direction: column; gap: 18px; }

    .day-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      scroll-margin-top: 124px;
      transition: border-color 0.2s ease;
    }

    .day-card.is-today { border-color: rgba(255, 77, 92, 0.35); }

    .day-head {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
    }

    .day-head::before {
      content: '';
      width: 4px;
      height: 26px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
    }

    .day-head.is-today::before { height: 34px; }

    .day-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin: 0;
    }

    .day-count {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--faint);
      font-weight: 500;
    }

    .today-tag {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #0a0c10;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      padding: 5px 11px;
      border-radius: 999px;
    }

    .rows { }

    .row {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 13px 22px;
      border-bottom: 1px solid var(--border);
      position: relative;
      transition: background 0.12s ease;
    }

    .row:last-child { border-bottom: none; }

    .row::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .row:hover { background: var(--surface-2); }
    .row:hover::before { opacity: 1; }

    .row-time {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 600;
      color: var(--amber);
    }

    .row-title {
      font-size: 14.5px;
      font-weight: 500;
      line-height: 1.35;
      color: var(--text);
    }

    .row-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .row-platforms {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .plat-badge {
      font-family: var(--mono);
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.2px;
      color: var(--muted);
      text-decoration: none;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      transition: color 0.12s ease, border-color 0.12s ease, background 0.12s ease;
      white-space: nowrap;
    }

    .plat-badge:hover {
      color: var(--text);
      border-color: var(--border-strong);
      background: rgba(255, 255, 255, 0.09);
    }

    /* platform resmi tapi belum dikonfirmasi (dari musim depan) */
    .plat-badge.tentative {
      color: var(--faint);
      border-style: dashed;
      background: transparent;
      cursor: help;
    }

    .plat-badge.tentative:hover {
      color: var(--amber);
      border-color: rgba(255, 154, 61, 0.45);
      background: rgba(255, 154, 61, 0.06);
    }

    .row-side {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
      min-width: 0;
    }

    .todo-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid var(--border-strong);
      background: var(--surface-2);
      color: var(--muted);
      font-family: var(--display);
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      padding: 0;
      transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    }

    .todo-btn:hover {
      color: #0a0c10;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
    }

    .todo-btn.busy { opacity: 0.55; pointer-events: none; }
    .todo-btn.done {
      color: #0a0c10;
      background: #5ad38a;
      border-color: transparent;
      cursor: default;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      padding: 10px 16px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 100;
      max-width: min(90vw, 460px);
      text-align: center;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: rgba(255, 77, 92, 0.5); color: #ffb3ba; }

    .chip {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.6px;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
      text-transform: uppercase;
    }

    .chip.airing { color: #ff7a86; background: var(--accent-soft); }
    .chip.upcoming { color: var(--muted); background: rgba(255, 255, 255, 0.06); }
    .chip.tba { color: var(--faint); background: rgba(255, 255, 255, 0.04); }

    /* ===== Loading / error ===== */
    .state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 70px 20px;
      text-align: center;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--surface-2);
      border-top: 4px solid var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .state-text {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--muted);
    }

    .error-text {
      font-size: 15px;
      color: var(--accent);
      font-weight: 600;
    }

    /* ===== Footer ===== */
    .footer {
      margin-top: 34px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 12.5px;
      color: var(--faint);
    }

    .footer a { color: var(--muted); text-decoration: none; }
    .footer a:hover { color: var(--text); }

    /* ===== Search (client-side, fuzzy) ===== */
    .search-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .search-field {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 44px;
      padding: 0 12px 0 14px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .search-field:focus-within {
      border-color: rgba(255, 77, 92, 0.45);
      box-shadow: 0 0 0 3px rgba(255, 77, 92, 0.11);
      background: var(--bg-2);
    }

    .search-icon {
      flex-shrink: 0;
      color: var(--faint);
      display: block;
      transition: color 0.15s ease;
    }

    .search-field:focus-within .search-icon { color: var(--accent); }

    #searchInput {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--display);
      font-size: 14.5px;
      font-weight: 500;
    }

    #searchInput::placeholder { color: var(--faint); font-weight: 400; }
    #searchInput::-webkit-search-cancel-button,
    #searchInput::-webkit-search-decoration { -webkit-appearance: none; }

    .search-clear {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      display: none;
      place-items: center;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      color: var(--muted);
      font-family: var(--display);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .search-clear:hover {
      color: #0a0c10;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .search-field.has-value .search-clear { display: grid; }

    .search-field.has-query {
      border-color: rgba(255, 154, 61, 0.35);
    }

    .search-info {
      flex-shrink: 0;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.4px;
      color: var(--faint);
      white-space: nowrap;
    }

    .search-info.empty { color: var(--accent); }

    mark {
      background: rgba(255, 154, 61, 0.18);
      color: var(--amber);
      border-radius: 3px;
      padding: 0 1px;
    }

    .row.search-row { grid-template-columns: 96px 1fr auto; }

    .row.search-row .row-time {
      font-size: 12.5px;
      color: var(--muted);
    }

    .head-tag {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--amber);
      border: 1px solid rgba(255, 154, 61, 0.35);
      background: rgba(255, 154, 61, 0.08);
      padding: 4px 10px;
      border-radius: 999px;
    }

    @media (max-width: 620px) {
      .topbar { padding: 0 12px; gap: 8px; }
      .brand-name { display: none; }
      .onair-badge { display: none; }
      .season-switch { padding: 3px; }
      .season-tab { font-size: 10px; letter-spacing: 0.4px; padding: 5px 9px; }
      .season-tab .tab-year { display: none; }
      .season-note { font-size: 12px; padding: 10px 12px; }
      .container { padding: 18px 12px 48px; }
      .row { grid-template-columns: 56px 1fr auto; gap: 12px; padding: 12px 16px; }
      .day-head { padding: 15px 16px; }
      .day-name { font-size: 19px; }
      .search-wrap { gap: 8px; margin-bottom: 16px; }
      .search-field { height: 40px; padding: 0 10px 0 12px; gap: 8px; }
      #searchInput { font-size: 13.5px; }
      .search-info { font-size: 10px; }
      .row.search-row { grid-template-columns: 76px 1fr auto; }
      .row.search-row .row-time { font-size: 11.5px; }
      .nextup-main { flex-wrap: wrap; gap: 4px 10px; }
      .footer { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">▶</div>
      <span class="brand-name">Jadwal Anime</span>
      <span class="onair-badge"><span class="dot"></span>ON AIR</span>
    </div>
    <div class="topbar-right">
      <div id="seasonSwitch" class="season-switch" role="tablist" aria-label="Season"></div>
      <button class="refresh-btn" onclick="hardRefresh()">Refresh</button>
    </div>
  </header>

  <div class="container">
    <div id="nextup" class="nextup" style="display:none">
      <span class="nextup-label">NEXT UP</span>
      <div class="nextup-main">
        <span id="nextupTime" class="nextup-time"></span>
        <span id="nextupTitle" class="nextup-title"></span>
      </div>
      <span id="nextupCount" class="nextup-count"></span>
    </div>

    <div id="seasonNote" class="season-note" style="display:none"></div>

    <div id="todayStrip" class="today-strip" style="display:none">
      <div class="strip-head"><span class="dot"></span><span class="strip-label">Today on air</span></div>
      <div id="todayChips" class="chips"></div>
    </div>

    <div class="search-wrap">
      <div id="searchField" class="search-field">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20.5 20.5 16 16"></path></svg>
        <input id="searchInput" type="text" placeholder="Search title..." autocomplete="off" spellcheck="false" aria-label="Search title" />
        <button id="searchClear" class="search-clear" type="button" title="Clear search" aria-label="Clear search">×</button>
      </div>
      <span id="searchInfo" class="search-info"></span>
    </div>

    <nav id="dayNav" class="day-nav"></nav>

    <main id="schedule" class="schedule"></main>

    <footer class="footer">
      <span id="footerLeft">Jadwal anime musim ini</span>
      <span>Jadwal dari <a href="https://anilist.co" target="_blank" rel="noopener">AniList</a> · Platform dari <a href="https://db.silveryasha.id" target="_blank" rel="noopener">db.silveryasha.id</a></span>
    </footer>
  </div>

  <div id="toast" class="toast"></div>

  <script src="config.js"></script>
  <script>
    const DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const DAY_ORDER = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

    const STATUS_MAP = {
      RELEASING: { label: 'Airing', cls: 'airing' },
      NOT_YET_RELEASED: { label: 'Upcoming', cls: 'upcoming' },
      FINISHED: { label: 'Finished', cls: 'upcoming' },
      CANCELLED: { label: 'Cancelled', cls: 'tba' },
      HIATUS: { label: 'Hiatus', cls: 'tba' }
    };

    let PLATFORM_DATA = null;

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    const API_URL = 'https://tybantarnusa.com/lab/jadwal-anime/schedule.php';
    const TODOIST_API_URL = 'https://tybantarnusa.com/lab/jadwal-anime/todoist.php';

    async function fetchSchedule() {
      const res = await fetch(API_URL, {
        cache: 'no-store',
        headers: { 'X-Api-Token': typeof API_TOKEN !== 'undefined' ? API_TOKEN : '' }
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Backend error');
      return json;
    }

    let toastTimer = null;
    function showToast(msg, isError = false) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show' + (isError ? ' error' : '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { el.className = 'toast'; }, 2600);
    }

    async function addToTodoist(anilistId, btn) {
      if (!btn || btn.classList.contains('busy')) return;
      btn.classList.add('busy');
      btn.textContent = '…';
      try {
        const res = await fetch(TODOIST_API_URL, {
          method: 'POST',
          cache: 'no-store',
          headers: {
            'Content-Type': 'application/json',
            'X-Api-Token': typeof API_TOKEN !== 'undefined' ? API_TOKEN : ''
          },
          body: JSON.stringify({ anilist_id: anilistId })
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok || !json.ok) throw new Error(json.error || 'HTTP ' + res.status);
        btn.classList.add('done');
        btn.textContent = '✓';
        showToast(json.created ? 'Added: ' + json.content : (json.message || 'Already in Todoist'));
        setTimeout(() => { btn.classList.remove('done'); btn.textContent = '+'; }, 2400);
      } catch (err) {
        showToast('Failed: ' + (err.message || 'unknown'), true);
      } finally {
        btn.classList.remove('busy');
      }
    }

    function getJSTNow() {
      const now = new Date();
      const utc = now.getTime() + now.getTimezoneOffset() * 60000;
      return new Date(utc + 9 * 60 * 60000);
    }

    function getJSTParts(airingAt) {
      const d = new Date(airingAt * 1000);
      const totalMin = d.getUTCHours() * 60 + d.getUTCMinutes() + 9 * 60;
      const dayMin = ((totalMin % 1440) + 1440) % 1440;
      let day = d.getUTCDay() + Math.floor(totalMin / 1440);
      day = ((day % 7) + 7) % 7;
      const hh = String(Math.floor(dayMin / 60)).padStart(2, '0');
      const mm = String(dayMin % 60).padStart(2, '0');
      return { dayIndex: day, dayName: DAY_NAMES[day], time: hh + ':' + mm };
    }

    function processAnime(rawData) {
      const seen = new Set();
      const list = [];
      rawData.forEach(a => {
        const title = a.title;
        if (!title || seen.has(title)) return;
        seen.add(title);

        let dayName = null;
        let time = 'TBA';
        const airingAt = a.airingAt || null;
        if (airingAt) {
          const p = getJSTParts(airingAt);
          dayName = p.dayName;
          time = p.time;
        }

        const st = STATUS_MAP[a.status] || { label: a.status || 'Unknown', cls: 'tba' };
        list.push({ id: a.id, title, time, dayName, airingAt, status: st.label, statusCls: st.cls });
      });
      return list;
    }

    function groupByDay(list) {
      const grouped = {};
      DAY_ORDER.forEach(d => grouped[d] = []);
      grouped['TBA'] = [];
      list.forEach(a => {
        const key = a.dayName || 'TBA';
        grouped[key].push(a);
      });
      for (const d in grouped) {
        grouped[d].sort((x, y) => {
          if (x.time === 'TBA') return 1;
          if (y.time === 'TBA') return -1;
          return x.time.localeCompare(y.time);
        });
      }
      return grouped;
    }

    // ===== search: client-side + fuzzy, di season yang aktif aja =====
    // karakter Cyrillic/ª yang nyempil di judul (AniList suka campur) -> huruf latin yang mirip
    const HOMOGLYPHS = { '\u044f': 'r', '\u043e': 'o', '\u0435': 'e', '\u0430': 'a', '\u0441': 'c',
      '\u0440': 'p', '\u0445': 'x', '\u0443': 'y', '\u0456': 'i', '\u0455': 's', '\u0458': 'j',
      '\u043c': 'm', '\u043a': 'k', '\u0442': 't', '\u0432': 'b', '\u043d': 'h', '\u00aa': 'a',
      '\u00ba': 'o' };

    // normalisasi: huruf kecil, buang diakritik (PokéOki -> pokeoki), seragamkan homoglyph,
    // sisanya jadi spasi. Judul non-latin (kanji/kana) tetap disimpen hurufnya biar masih bisa dicari.
    function normStr(s) {
      let base = String(s ?? '').toLowerCase().normalize('NFKD')
        .replace(/[\u0300-\u036f\u1ab0-\u1aff\u1dc0-\u1dff\u20d0-\u20ff\uFE20-\uFE2F]/g, '')
        .replace(/\u00df/g, 'ss').replace(/\u00e6/g, 'ae').replace(/\u0153/g, 'oe')
        .replace(/\u00f8/g, 'o').replace(/\u0142/g, 'l').replace(/\u0111/g, 'd');
      base = base.replace(/[\u0400-\u04ff\u00aa\u00ba]/g, c => HOMOGLYPHS[c] || ' ');
      const latin = base.replace(/[^a-z0-9]+/g, ' ').trim();
      if (latin) return latin;
      return base.replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
    }

    // panjang awalan yang sama antara 2 kata ("pokemon" vs "pokeoki" -> 4)
    function sharedPrefix(a, b) {
      let i = 0;
      while (i < a.length && i < b.length && a[i] === b[i]) i++;
      return i;
    }

    function levDist(a, b) {
      const m = a.length, n = b.length;
      if (!m) return n;
      if (!n) return m;
      let prev = new Array(n + 1), cur = new Array(n + 1);
      for (let j = 0; j <= n; j++) prev[j] = j;
      for (let i = 1; i <= m; i++) {
        cur[0] = i;
        for (let j = 1; j <= n; j++) {
          const cost = a.charCodeAt(i - 1) === b.charCodeAt(j - 1) ? 0 : 1;
          cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
        }
        const tmp = prev; prev = cur; cur = tmp;
      }
      return prev[n];
    }

    function levRatio(a, b) {
      const max = Math.max(a.length, b.length);
      return max ? 1 - levDist(a, b) / max : 1;
    }

    // skor 0 = nggak match; makin gede makin relevan
    function matchScore(q, title) {
      if (!q) return 1;
      const t = normStr(title);
      if (!t) return 0;
      if (t === q) return 1000;
      if (t.indexOf(q) === 0) return 900;
      const at = t.indexOf(q);
      if (at > -1) return 820 - Math.min(at, 40);

      const qt = q.split(' ').filter(Boolean);
      const tt = t.split(' ').filter(Boolean);

      // singkatan: "aot" -> Attack on Titan (inisial prefix kata-katanya)
      if (qt.length === 1) {
        const initials = tt.map(w => w.charAt(0)).join('');
        for (let k = 2; k <= initials.length; k++) {
          if (q.length >= 2 && initials.slice(0, k) === q) return 780;
        }
      }

      // spasi diabaikan: "onepiece" -> One Piece
      if (q.length >= 5 && t.replace(/ /g, '').indexOf(q) > -1) return 760;

      // semua kata ada di judul, urutan bebas
      if (qt.length > 1 && qt.every(tok => t.indexOf(tok) > -1)) return 700;

      // fuzzy per kata: tahan typo / potongan kata
      let sum = 0;
      for (const tok of qt) {
        let best = 0;
        for (const w of tt) {
          if (w === tok) { best = 1; break; }
          if (tok.length >= 3 && w.indexOf(tok) === 0) { best = Math.max(best, 0.96); continue; }
          if (tok.length >= 4 && w.indexOf(tok) > -1) { best = Math.max(best, 0.9); continue; }
          if (tok.length >= 3 && Math.abs(w.length - tok.length) <= 3) {
            const r = levRatio(tok, w);
            if (r >= 0.7) { best = Math.max(best, r * 0.86); continue; }
          }
          // awalan kata masih sama walau sisanya beda: "pokemon" vs "pokeoki"
          if (tok.length >= 5 && sharedPrefix(tok, w) >= 4) best = Math.max(best, 0.72);
        }
        if (best < 0.7) return 0;
        sum += best;
      }
      return Math.round(300 + (sum / qt.length) * 250);
    }

    // daftar hasil diurut skor, lalu jam tayang
    function searchList(list, query) {
      const q = normStr(query);
      if (!q) return [];
      const out = [];
      list.forEach(a => {
        const s = matchScore(q, a.title);
        if (s > 0) out.push({ a, s });
      });
      out.sort((x, y) => y.s - x.s
        || ((x.a.airingAt || Infinity) - (y.a.airingAt || Infinity))
        || x.a.title.localeCompare(y.a.title));
      return out.map(m => m.a);
    }

    // tebelin bagian judul yang cocok (exact substring per kata)
    function highlightTitle(title, query) {
      const tokens = normStr(query).split(' ').filter(t => t.length >= 2);
      const safe = esc(title);
      if (!tokens.length) return safe;
      const re = new RegExp('(' + tokens.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
      return safe.replace(re, '<mark>$1</mark>');
    }

    function platformHtml(id) {
      const plats = (PLATFORM_DATA && PLATFORM_DATA[id]) || [];
      if (!plats.length) return '';
      return `<div class="row-platforms">${plats.map(p => {
        const label = esc(p.platform);
        const tentative = (p.status === 'Tentatif') || !p.url;
        const tip = `${label} · ${esc(tentative ? 'not confirmed yet' : (p.status || ''))}`;
        if (tentative) return `<span class="plat-badge tentative" title="${tip}">${label}</span>`;
        return `<a class="plat-badge" href="${esc(p.url)}" target="_blank" rel="noopener" title="${tip}">${label}</a>`;
      }).join('')}</div>`;
    }

    function buildRow(a, highlightQuery) {
      const row = document.createElement('div');
      row.className = 'row' + (highlightQuery ? ' search-row' : '');
      const timeText = highlightQuery
        ? (a.dayName ? a.dayName.slice(0, 3) + ' ' + a.time : a.time)
        : a.time;
      const todoBtn = a.airingAt
        ? `<button type="button" class="todo-btn" title="Add to Todoist" aria-label="Add to Todoist" onclick="addToTodoist(${a.id}, this)">+</button>`
        : '';
      row.innerHTML = `
        <span class="row-time">${esc(timeText)}</span>
        <span class="row-main">
          <span class="row-title">${highlightQuery ? highlightTitle(a.title, highlightQuery) : esc(a.title)}</span>
          ${platformHtml(a.id)}
        </span>
        <span class="row-side">
          <span class="chip ${a.statusCls}">${esc(a.status)}</span>
          ${todoBtn}
        </span>
      `;
      return row;
    }

    // ===== season state =====
    const STATE = { data: null, seasons: [], key: null, list: [], query: '' };
    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    function seasonKey(s) { return s.season + '-' + s.year; }

    function activeSeason() {
      return STATE.seasons.find(s => seasonKey(s) === STATE.key) || STATE.seasons[0] || null;
    }

    function seasonName(s) {
      return s.season.charAt(0).toUpperCase() + s.season.slice(1).toLowerCase();
    }

    // tanggal (JST) dari unix timestamp
    function jstDate(unix) {
      const d = new Date(unix * 1000);
      return new Date(d.getTime() + d.getTimezoneOffset() * 60000 + 9 * 3600000);
    }

    function formatDate(unix, withYear = true) {
      const d = jstDate(unix);
      return `${MONTHS[d.getMonth()]} ${d.getDate()}` + (withYear ? `, ${d.getFullYear()}` : '');
    }

    function renderSeasonSwitch() {
      const el = document.getElementById('seasonSwitch');
      el.innerHTML = '';
      STATE.seasons.forEach(s => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'season-tab' + (seasonKey(s) === STATE.key ? ' active' : '');
        b.innerHTML = `${esc(seasonName(s))}<span class="tab-year">${s.year}</span>`
          + (s.current ? '' : '<span class="tab-tag">NEXT</span>');
        b.title = s.current
          ? `${s.label} · on air now`
          : `${s.label} · starts ${formatDate(s.startsAt)}`;
        b.onclick = () => {
          if (STATE.key === seasonKey(s)) return;
          STATE.key = seasonKey(s);
          renderSeason();
        };
        el.appendChild(b);
      });
    }

    function renderSeason() {
      const info = activeSeason();
      if (!info) return;
      const rows = (STATE.data.anime || []).filter(a =>
        a.season ? (a.season === info.season && a.year === info.year) : !!info.current
      );
      STATE.list = processAnime(rows);
      renderSeasonSwitch();
      render(STATE.list, info);
    }

    function renderSeasonNote(info, list) {
      const el = document.getElementById('seasonNote');
      if (info.current) { el.style.display = 'none'; return; }
      const tba = list.filter(a => !a.airingAt).length;
      el.style.display = 'flex';
      el.innerHTML = `
        <span class="note-tag">Upcoming</span>
        <span>Starts <b>${formatDate(info.startsAt)}</b> (JST) · day &amp; time below = first episode slot</span>
        <span>${list.length} titles announced${tba ? ` · ${tba} still TBA` : ''}</span>
      `;
    }

    function render(list, info) {
      const q = STATE.query.trim();
      if (q) { renderSearch(list, info, q); return; }
      renderSearchInfo(0, ''); // search dikosongin -> hitungan match jangan ketinggalan

      const grouped = groupByDay(list);
      const isCurrent = !!info.current;
      const todayName = isCurrent ? DAY_NAMES[getJSTNow().getDay()] : null;

      document.getElementById('footerLeft').textContent = `${list.length} titles · ${info.label}`;

      renderSeasonNote(info, list);
      renderNextUp(list, isCurrent);
      if (isCurrent) {
        renderTodayStrip(grouped[todayName], todayName);
      } else {
        document.getElementById('todayStrip').style.display = 'none';
      }
      renderNav(grouped, todayName);
      renderSchedule(grouped, todayName);
    }

    // hasil search: list datar, cuma dari season yang lagi aktif
    function renderSearch(list, info, query) {
      const matches = searchList(list, query);
      const grouped = groupByDay(list);
      const isCurrent = !!info.current;
      const todayName = isCurrent ? DAY_NAMES[getJSTNow().getDay()] : null;

      document.getElementById('footerLeft').textContent = `${list.length} titles · ${info.label}`;
      // next up / today on air / catatan musim tetap tampil biar nggak ada layout jump
      renderSeasonNote(info, list);
      renderNextUp(list, isCurrent);
      if (isCurrent) {
        renderTodayStrip(grouped[todayName], todayName);
      } else {
        document.getElementById('todayStrip').style.display = 'none';
      }
      // pill hari disembunyiin: kartu per hari lagi nggak ada, jadi anchor-nya mati
      document.getElementById('dayNav').innerHTML = '';
      renderSearchInfo(matches.length, query);

      const main = document.getElementById('schedule');
      main.innerHTML = '';
      if (!matches.length) {
        main.innerHTML = `<div class="state"><div class="state-text">No title matches “${esc(query)}” in ${esc(info.label)}.</div></div>`;
        return;
      }

      const card = document.createElement('section');
      card.className = 'day-card';
      const head = document.createElement('div');
      head.className = 'day-head';
      head.innerHTML = `
        <h2 class="day-name">Results</h2>
        <span class="day-count">${matches.length} ${matches.length === 1 ? 'title' : 'titles'} in ${esc(info.label)}</span>
        <span class="head-tag">SEARCH</span>
      `;
      card.appendChild(head);

      const rows = document.createElement('div');
      rows.className = 'rows';
      matches.forEach(a => rows.appendChild(buildRow(a, query)));
      card.appendChild(rows);
      main.appendChild(card);
    }

    function renderSearchInfo(count, query) {
      const el = document.getElementById('searchInfo');
      if (!query) { el.textContent = ''; el.className = 'search-info'; return; }
      el.className = 'search-info' + (count ? '' : ' empty');
      el.textContent = count ? `${count} ${count === 1 ? 'match' : 'matches'}` : 'no match';
    }

    function renderNextUp(list, isCurrent) {
      const el = document.getElementById('nextup');
      const label = el.querySelector('.nextup-label');
      const upcoming = list.filter(a => a.airingAt).sort((a, b) => a.airingAt - b.airingAt);
      if (!upcoming.length) { el.style.display = 'none'; window.__nextUp = null; return; }
      const next = upcoming[0];
      window.__nextUp = next;
      el.style.display = 'flex';
      label.textContent = isCurrent ? 'NEXT UP' : 'SEASON PREMIERE';
      document.getElementById('nextupTime').textContent = isCurrent
        ? next.dayName + ' ' + next.time
        : next.dayName + ' ' + next.time + ' · ' + formatDate(next.airingAt);
      document.getElementById('nextupTitle').textContent = next.title;
      tickNextUp();
    }

    function tickNextUp() {
      const next = window.__nextUp;
      const countEl = document.getElementById('nextupCount');
      if (!next || !countEl) return;
      const diff = next.airingAt - Math.floor(Date.now() / 1000);
      if (diff <= 0) {
        countEl.textContent = 'AIRING NOW';
        return;
      }
      const pad = n => String(n).padStart(2, '0');
      const d = Math.floor(diff / 86400);
      const h = Math.floor((diff % 86400) / 3600);
      const m = Math.floor((diff % 3600) / 60);
      const s = diff % 60;
      if (d > 0) countEl.textContent = `in ${d}d ${pad(h)}h ${pad(m)}m`;
      else if (h > 0) countEl.textContent = `in ${h}h ${pad(m)}m ${pad(s)}s`;
      else countEl.textContent = `in ${pad(m)}m ${pad(s)}s`;
    }

    function renderTodayStrip(todayList, todayName) {
      const wrap = document.getElementById('todayStrip');
      if (!todayList || !todayList.length) { wrap.style.display = 'none'; return; }
      wrap.style.display = 'block';
      const chips = document.getElementById('todayChips');
      chips.innerHTML = '';
      todayList.forEach(a => {
        const c = document.createElement('div');
        c.className = 'chip-item';
        c.innerHTML = `<span class="chip-time">${a.time}</span><span class="chip-title">${a.title}</span>`;
        chips.appendChild(c);
      });
    }

    function renderNav(grouped, todayName) {
      const nav = document.getElementById('dayNav');
      nav.innerHTML = '';
      [...DAY_ORDER, 'TBA'].forEach(day => {
        if (!grouped[day] || !grouped[day].length) return;
        const a = document.createElement('a');
        a.href = `#day-${day}`;
        a.className = 'day-pill' + (day === todayName ? ' active' : '');
        a.innerHTML = `${day} <span class="pill-count">${grouped[day].length}</span>`;
        nav.appendChild(a);
      });
    }

    function renderSchedule(grouped, todayName) {
      const main = document.getElementById('schedule');
      main.innerHTML = '';
      [...DAY_ORDER, 'TBA'].forEach(day => {
        const shows = grouped[day];
        if (!shows || !shows.length) return;

        const isToday = day === todayName;
        const card = document.createElement('section');
        card.className = 'day-card' + (isToday ? ' is-today' : '');
        card.id = `day-${day}`;

        const head = document.createElement('div');
        head.className = 'day-head' + (isToday ? ' is-today' : '');
        head.innerHTML = `
          <h2 class="day-name">${day}</h2>
          <span class="day-count">${shows.length} ${shows.length === 1 ? 'title' : 'titles'}</span>
          ${isToday ? '<span class="today-tag">TODAY</span>' : ''}
        `;
        card.appendChild(head);

        const rows = document.createElement('div');
        rows.className = 'rows';
        shows.forEach(a => rows.appendChild(buildRow(a)));
        card.appendChild(rows);
        main.appendChild(card);
      });
    }

    // ===== search wiring (semua lokal, nggak nembak backend) =====
    const searchInput = document.getElementById('searchInput');
    const searchField = document.getElementById('searchField');
    let searchDebounce = null;

    function applySearch() {
      const v = searchInput.value;
      STATE.query = v;
      searchField.classList.toggle('has-value', !!v);
      searchField.classList.toggle('has-query', !!v.trim());
      if (!STATE.data) return;
      const info = activeSeason();
      if (info) render(STATE.list, info);
    }

    function clearSearch() {
      searchInput.value = '';
      applySearch();
    }

    searchInput.addEventListener('input', () => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(applySearch, 80);
    });

    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Escape' && searchInput.value) {
        e.preventDefault();
        clearSearch();
      }
    });

    document.getElementById('searchClear').addEventListener('click', () => {
      clearSearch();
      searchInput.focus();
    });

    let tickTimer = null;

    async function loadSchedule() {
      const main = document.getElementById('schedule');
      const nav = document.getElementById('dayNav');
      const strip = document.getElementById('todayStrip');
      const nextup = document.getElementById('nextup');
      const note = document.getElementById('seasonNote');
      nav.innerHTML = '';
      strip.style.display = 'none';
      nextup.style.display = 'none';
      note.style.display = 'none';
      main.innerHTML = `<div class="state"><div class="spinner"></div><div class="state-text">Loading schedule...</div></div>`;

      try {
        const data = await fetchSchedule();
        PLATFORM_DATA = data.platforms || {};

        let seasons = Array.isArray(data.seasons) ? data.seasons.slice() : [];
        if (!seasons.length && data.season && data.year) {
          // fallback kalau backend lama (cuma 1 musim)
          seasons = [{
            season: data.season,
            year: data.year,
            label: data.season + ' ' + data.year,
            current: true,
            startsAt: 0,
            count: (data.anime || []).length
          }];
        }
        if (!seasons.some(s => s.current) && seasons.length) seasons[0].current = true;
        // musim depan yang datanya belum ada jangan ditampilin
        seasons = seasons.filter(s => s.current || s.count > 0);

        STATE.data = data;
        STATE.seasons = seasons;
        if (!STATE.key || !seasons.some(s => seasonKey(s) === STATE.key)) {
          STATE.key = seasonKey(seasons.find(s => s.current) || seasons[0]);
        }
        renderSeason();

        if (tickTimer) clearInterval(tickTimer);
        tickTimer = setInterval(tickNextUp, 1000);
      } catch (err) {
        console.error('Gagal load data:', err);
        main.innerHTML = `<div class="state"><div class="error-text">Failed to load schedule. Try again later.</div></div>`;
      }
    }

    function hardRefresh() {
      loadSchedule();
    }

    window.onload = () => loadSchedule();
  </script>
</body>
</html>
