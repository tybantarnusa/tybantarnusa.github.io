<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jadwal Anime</title>
  <style>
    body {
      font-family: Calibri, sans-serif;
      background-color: #1a1a1a;
      color: #e0e0e0;
      margin: 0;
    }

    h1 {
      text-align: center;
    }

    table {
      width: 80%;
      margin: 20px auto;
      border-collapse: collapse;
      background-color: #2a2a2a;
      table-layout: fixed;
    }

    th, td {
      border: 1px solid #444;
      padding: 8px;
      text-align: left;
      color: #e0e0e0;
    }

    th {
      background-color: #3a3a3a;
    }

    .day-header {
      background-color: #4a4a4a;
      font-weight: bold;
      text-align: center;
    }

    .anime-row:nth-child(even) {
      background-color: #333;
    }

    .anime-row:nth-child(odd) {
      background-color: #2a2a2a;
    }

    .highlighted {
      background-color: #0066cc !important;
    }

    .refresh-btn {
      display: block;
      margin: 10px auto;
      padding: 8px 16px;
      background-color: #555;
      color: #e0e0e0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .refresh-btn:hover {
      background-color: #666;
    }

    .loading-wrapper, .error-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #888;
      border-top: 4px solid #e0e0e0;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .progress-container {
      width: 100%;
      background-color: #444;
      border-radius: 4px;
      height: 8px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background-color: #66cc66;
      width: 0;
      transition: width 0.5s ease;
    }

    .error-message {
      color: red;
      text-align: center;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Jadwal Anime</h1>
  <button class="refresh-btn" onclick="hardRefresh()">Refresh Data</button>
  <table>
    <thead>
      <tr>
        <th>Judul</th>
        <th>Jam</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="scheduleBody">
      <tr><td colspan="3"><div class="loading-wrapper"><div class="spinner"></div></div></td></tr>
      <tr>
        <td colspan="3">
          <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
          </div>
        </td>
      </tr>
    </tbody>
  </table>

  <script>
    const dayTranslation = {
      'Mondays': 'Senin',
      'Tuesdays': 'Selasa',
      'Wednesdays': 'Rabu',
      'Thursdays': 'Kamis',
      'Fridays': 'Jumat',
      'Saturdays': 'Sabtu',
      'Sundays': 'Minggu'
    };

    const dayToIndex = {
      'Sundays': 0,
      'Mondays': 1,
      'Tuesdays': 2,
      'Wednesdays': 3,
      'Thursdays': 4,
      'Fridays': 5,
      'Saturdays': 6
    };

    function getJSTNow() {
      const now = new Date();
      const utc = now.getTime() + now.getTimezoneOffset() * 60000;
      return new Date(utc + 9 * 60 * 60000); // JST = UTC+9
    }

    function getNextAnimeDate(dayStr, timeStr) {
      if (!timeStr || !dayToIndex.hasOwnProperty(dayStr)) return null;
      const [hour, minute] = timeStr.split(':').map(Number);
      const now = getJSTNow();
      const nowDay = now.getDay();
      const targetDay = dayToIndex[dayStr];

      const diff = (targetDay - nowDay + 7) % 7;
      const animeDate = new Date(now);
      animeDate.setDate(now.getDate() + diff);
      animeDate.setHours(hour, minute, 0, 0);

      if (diff === 0 && animeDate > now) {
        animeDate.setDate(animeDate.getDate() - 7);
      } else if (animeDate > now) {
        animeDate.setDate(animeDate.getDate() - 7);
      }

      return animeDate;
    }

    async function fetchAllAnimeDataSafe() {
      const firstRes = await fetch(`https://api.jikan.moe/v4/seasons/now?page=1&limit=25`);
      const firstJson = await firstRes.json();
      const totalPages = Math.min(firstJson.pagination.last_visible_page, 10);
      const allAnime = [...firstJson.data];

      for (let i = 2; i <= totalPages; i++) {
        await new Promise(resolve => setTimeout(resolve, 350));
        try {
          const res = await fetch(`https://api.jikan.moe/v4/seasons/now?page=${i}&limit=25`);
          const json = await res.json();
          allAnime.push(...json.data);
          updateProgressBar(i, totalPages);
        } catch (e) {
          console.warn(`Gagal ambil halaman ${i}:`, e);
        }
      }

      return allAnime;
    }

    function updateProgressBar(currentPage, totalPages) {
      const progress = (currentPage / totalPages) * 100;
      document.getElementById('progressBar').style.width = `${progress}%`;
    }

    async function loadSchedule(forceRefresh = false) {
      const tbody = document.getElementById("scheduleBody");
      tbody.innerHTML = `<tr><td colspan="3"><div class="loading-wrapper"><div class="spinner"></div></div></td></tr>
                         <tr><td colspan="3"><div class="progress-container"><div id="progressBar" class="progress-bar"></div></div></td></tr>`;

      try {
        const cacheKey = "animeSchedule";
        let animeData = null;

        if (!forceRefresh) {
          const cached = localStorage.getItem(cacheKey);
          if (cached) {
            const { data, timestamp } = JSON.parse(cached);
            const now = Date.now();
            const jstMidnight = new Date(getJSTNow());
            jstMidnight.setHours(0, 0, 0, 0);
            if (timestamp >= jstMidnight.getTime() && now >= timestamp) {
              animeData = data;
            }
          }
        }

        if (!animeData) {
          animeData = await fetchAllAnimeDataSafe();
          localStorage.setItem(cacheKey, JSON.stringify({ data: animeData, timestamp: Date.now() }));
        }

        const uniqueAnime = [];
        const seen = new Set();
        animeData.forEach(anime => {
          const title = anime.titles?.[0]?.title;
          const time = anime.broadcast?.time;
          const day = anime.broadcast?.day;
          const status = anime.status || 'Unknown';
          if (title && !seen.has(title)) {
            seen.add(title);
            uniqueAnime.push({ title, time, day, status });
          }
        });

        let latestAired = null;
        const now = getJSTNow();

        uniqueAnime.forEach(anime => {
          const date = getNextAnimeDate(anime.day, anime.time);
          if (date && date <= now) {
            if (!latestAired || date > latestAired.date) {
              latestAired = { ...anime, date };
            }
          }
        });

        const grouped = {};
        uniqueAnime.forEach(anime => {
          const day = dayTranslation[anime.day] || 'Lainnya';
          if (!grouped[day]) grouped[day] = [];
          grouped[day].push(anime);
        });

        for (const day in grouped) {
          grouped[day].sort((a, b) => {
            if (!a.time || !b.time) return 0;
            return a.time.localeCompare(b.time);
          });
        }

        const daysOrder = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu','Lainnya'];
        tbody.innerHTML = '';

        daysOrder.forEach(day => {
          if (!grouped[day]) return;
          const header = document.createElement('tr');
          header.innerHTML = `<td colspan="3" class="day-header">${day}</td>`;
          tbody.appendChild(header);

          grouped[day].forEach(anime => {
            const row = document.createElement('tr');
            row.className = 'anime-row';

            if (
              latestAired &&
              anime.title === latestAired.title &&
              anime.time === latestAired.time &&
              anime.status === latestAired.status
            ) {
              row.classList.add('highlighted');
            }

            row.innerHTML = `
              <td>${anime.title}</td>
              <td>${anime.time || 'TBA'}</td>
              <td>${anime.status}</td>
            `;
            tbody.appendChild(row);
          });
        });

      } catch (err) {
        console.error('Gagal load data:', err);
        tbody.innerHTML = `<tr><td colspan="3"><div class="error-wrapper"><div class="error-message">❌ Gagal mengambil data. Coba lagi nanti.</div></div></td></tr>`;
      }
    }

    function hardRefresh() {
      loadSchedule(true);
    }

    window.onload = () => loadSchedule();
  </script>
</body>
</html>
