<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Anime</title>
    <style>
        body {
            font-family: Calibri, sans-serif;
            background-color: #1a1a1a; /* Latar belakang gelap */
            color: #e0e0e0; /* Teks terang */
            margin: 0;
        }
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            font-family: Calibri, sans-serif;
            background-color: #2a2a2a; /* Latar tabel gelap */
        }
        th, td {
            border: 1px solid #444; /* Border abu-abu gelap */
            padding: 8px;
            text-align: left;
            width: 33.33%;
            color: #e0e0e0;
        }
        th {
            background-color: #3a3a3a; /* Header tabel lebih terang sedikit */
        }
        .day-header {
            background-color: #4a4a4a; /* Header hari */
            font-weight: bold;
            text-align: center;
        }
        .anime-row:nth-child(even) {
            background-color: #333333; /* Baris genap */
        }
        .anime-row:nth-child(odd) {
            background-color: #2a2a2a; /* Baris ganjil */
        }
        h1 {
            color: #e0e0e0;
            text-align: center;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #e0e0e0;
        }
    </style>
</head>
<body>
    <h1>Jadwal Anime</h1>
    <table id="animeSchedule">
        <thead>
            <tr>
                <th>Judul</th>
                <th>Jam</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="scheduleBody">
            <tr><td colspan="3" class="loading">Loading...</td></tr>
        </tbody>
    </table>

    <script>
        // Konversi hari dari Inggris ke Indonesia
        const dayTranslation = {
            'Mondays': 'Senin',
            'Tuesdays': 'Selasa',
            'Wednesdays': 'Rabu',
            'Thursdays': 'Kamis',
            'Fridays': 'Jumat',
            'Saturdays': 'Sabtu',
            'Sundays': 'Minggu'
        };

        async function fetchAllAnimeData() {
            let allAnime = [];
            let currentPage = 1;
            let hasNextPage = true;

            while (hasNextPage) {
                try {
                    const response = await fetch(`https://api.jikan.moe/v4/seasons/now?page=${currentPage}`);
                    const result = await response.json();
                    allAnime = allAnime.concat(result.data);
                    hasNextPage = result.pagination.has_next_page;
                    currentPage = result.pagination.current_page + 1;
                    await new Promise(resolve => setTimeout(resolve, 1000));
                } catch (error) {
                    console.error('Error fetching page:', currentPage, error);
                    break;
                }
            }
            return allAnime;
        }

        function getCachedData() {
            const cached = localStorage.getItem('animeSchedule');
            if (cached) {
                const { data, timestamp } = JSON.parse(cached);
                const now = Date.now();
                const oneDay = 24 * 60 * 60 * 1000;
                if (now - timestamp < oneDay) {
                    return data;
                }
            }
            return null;
        }

        function setCachedData(data) {
            const cacheObject = {
                data,
                timestamp: Date.now()
            };
            localStorage.setItem('animeSchedule', JSON.stringify(cacheObject));
        }

        async function loadSchedule() {
            const tbody = document.getElementById('scheduleBody');

            let animeData = getCachedData();
            if (!animeData) {
                animeData = await fetchAllAnimeData();
                setCachedData(animeData);
            } else {
                console.log('Menggunakan data dari cache');
            }

            try {
                const uniqueAnime = [];
                const seenTitles = new Set();
                animeData.forEach(anime => {
                    const title = anime.titles[0].title;
                    if (!seenTitles.has(title)) {
                        seenTitles.add(title);
                        uniqueAnime.push(anime);
                    }
                });

                const groupedByDay = uniqueAnime.reduce((acc, anime) => {
                    const day = anime.broadcast.day;
                    const translatedDay = day ? dayTranslation[day] || 'Lainnya' : 'Lainnya';
                    const title = anime.titles[0].title;
                    const time = anime.broadcast.time || 'TBA';
                    const status = anime.status || 'Unknown';

                    if (!acc[translatedDay]) {
                        acc[translatedDay] = [];
                    }
                    acc[translatedDay].push({ title, time, status });
                    return acc;
                }, {});

                for (const day in groupedByDay) {
                    groupedByDay[day].sort((a, b) => {
                        if (a.time === 'TBA' && b.time !== 'TBA') return 1;
                        if (b.time === 'TBA' && a.time !== 'TBA') return -1;
                        if (a.time === 'TBA' && b.time === 'TBA') return 0;
                        return a.time.localeCompare(b.time);
                    });
                }

                tbody.innerHTML = '';
                const daysOrder = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu', 'Lainnya'];

                daysOrder.forEach(day => {
                    if (groupedByDay[day]) {
                        const dayRow = document.createElement('tr');
                        dayRow.innerHTML = `<td colspan="3" class="day-header">${day}</td>`;
                        tbody.appendChild(dayRow);

                        groupedByDay[day].forEach(anime => {
                            const row = document.createElement('tr');
                            row.className = 'anime-row';
                            row.innerHTML = `
                                <td>${anime.title}</td>
                                <td>${anime.time}</td>
                                <td>${anime.status}</td>
                            `;
                            tbody.appendChild(row);
                        });
                    }
                });
            } catch (error) {
                console.error('Error loading schedule:', error);
                tbody.innerHTML = '<tr><td colspan="3">Gagal memuat jadwal anime</td></tr>';
            }
        }

        window.onload = loadSchedule;
    </script>
</body>
</html>
